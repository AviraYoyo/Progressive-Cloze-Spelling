<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCS 挖空演算法預覽 · Progressive Cloze Spelling</title>
<style>
  :root {
    /* 課堂配色：暖陽橙為主，貼近真實教學環境的高對比需求 */
    --orange:      #F97316;
    --orange-dark: #C2410C;
    --orange-soft: #FFF3E8;

    /* 沿用 PPT 的三態色值 */
    --input-blue:  #5170FF;   /* 學生輸入的字母 */
    --correct:     #65BE22;   /* 正確 */
    --wrong:       #FF1616;   /* 錯誤 */
    --accent:      #CB6CE6;   /* PPT 強調紫 */

    --ink:         #1F2937;
    --ink-soft:    #6B7280;
    --line:        #E5E7EB;
    --bg:          #FDFCFB;
    --card:        #FFFFFF;

    --radius:      14px;
    --shadow:      0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Arimo', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }

  header {
    background: linear-gradient(135deg, var(--orange) 0%, #FB923C 100%);
    color: #fff;
    padding: 28px 32px 24px;
  }
  header h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; }
  header p  { margin: 0; opacity: .95; font-size: 14.5px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; }

  /* ── 輸入區 ── */
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .panel h2 {
    margin: 0 0 14px; font-size: 15px; font-weight: 700;
    color: var(--orange-dark); text-transform: uppercase; letter-spacing: .06em;
  }
  textarea {
    width: 100%; min-height: 92px; padding: 12px 14px;
    border: 2px solid var(--line); border-radius: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px; resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--orange); }
  .hint { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
  .hint code {
    background: var(--orange-soft); padding: 1px 6px; border-radius: 4px;
    font-size: 12.5px; color: var(--orange-dark);
  }

  /* ── 詞卡片網格 ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 18px;
  }

  .word-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .word-card > header {
    padding: 14px 18px;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  .word-card .w {
    font-size: 22px; font-weight: 800; letter-spacing: .01em;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .word-card .len {
    font-size: 12px; color: var(--ink-soft);
    background: var(--bg); padding: 2px 8px; border-radius: 20px;
    border: 1px solid var(--line);
  }

  .body { padding: 0 18px 18px; }

  /* ── grapheme 切分顯示 ── */
  .graphemes {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; margin-bottom: 14px;
    display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
  }
  .graphemes .lbl { font-family: inherit; font-size: 11.5px; color: var(--ink-soft); margin-right: 2px; }
  .gch {
    padding: 2px 7px; border-radius: 6px;
    background: #F3F4F6; color: var(--ink-soft); border: 1px solid var(--line);
  }
  .gch.pat {
    background: var(--orange-soft); color: var(--orange-dark);
    border-color: #FED7AA; font-weight: 700;
  }

  /* ── 關卡列表 ── */
  .level {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px; border-radius: 10px;
    background: #FAFAF9; border: 1px solid var(--line);
    margin-bottom: 8px;
  }
  .level:last-child { margin-bottom: 0; }
  .level.lv1 { border-left: 4px solid var(--orange); }
  .level.lv2 { border-left: 4px solid #FDBA74; }
  .level.lv3 { border-left: 4px solid #FED7AA; }

  .lv-tag {
    flex-shrink: 0; width: 34px; text-align: center;
    font-size: 11px; font-weight: 800; color: var(--orange-dark);
    letter-spacing: .04em;
  }

  .cloze {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 21px; font-weight: 700; letter-spacing: .1em;
    white-space: pre; flex-shrink: 0;
  }
  .cloze .blank {
    color: var(--input-blue); background: var(--orange-soft);
    border-bottom: 3px solid var(--input-blue);
    border-radius: 3px; padding: 0 1px;
  }

  .lv-info { margin-left: auto; text-align: right; font-size: 12px; color: var(--ink-soft); min-width: 0; }
  .lv-info .pat {
    display: inline-block; background: var(--orange-soft); color: var(--orange-dark);
    padding: 1px 7px; border-radius: 5px; font-weight: 700; font-size: 11.5px;
  }
  .lv-info .wt { font-variant-numeric: tabular-nums; }
  .lv-info .nm { display: block; margin-top: 3px; font-size: 11.5px; opacity: .85;
                 max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 權重表 ── */
  .wt-bar {
    height: 5px; border-radius: 3px; margin-top: 5px;
    background: linear-gradient(90deg, var(--orange) var(--pct), #E5E7EB var(--pct));
  }

  details { margin-top: 10px; }
  summary {
    cursor: pointer; font-size: 12px; color: var(--ink-soft);
    padding: 5px 0; user-select: none;
  }
  summary:hover { color: var(--orange-dark); }
  .note-full {
    font-size: 12.5px; color: var(--ink-soft); line-height: 1.65;
    padding: 9px 12px; background: #FAFAF9; border-radius: 8px;
    border-left: 3px solid var(--line); margin-top: 4px;
  }

  /* ── 權重總表 ── */
  .rank-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rank-table th {
    text-align: left; padding: 8px 10px; background: var(--orange-soft);
    color: var(--orange-dark); font-size: 12px; font-weight: 700;
    position: sticky; top: 0;
  }
  .rank-table td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .rank-table tr:hover td { background: #FFFBF7; }
  .rank-table code {
    background: #F3F4F6; padding: 1px 6px; border-radius: 4px;
    font-size: 12.5px; font-weight: 700;
  }
  .tag {
    font-size: 11px; padding: 1px 7px; border-radius: 20px; margin-right: 5px;
    display: inline-block;
  }
  .t1 { background: #FEE2E2; color: #991B1B; }
  .t2 { background: #FEF3C7; color: #92400E; }
  .t3 { background: #DBEAFE; color: #1E40AF; }
  .t4 { background: #DCFCE7; color: #166534; }
  .t5 { background: #F3E8FF; color: #6B21A8; }
  .t6 { background: #F3F4F6; color: #4B5563; }

  .scroll { max-height: 460px; overflow-y: auto; border-radius: 8px; border: 1px solid var(--line); }

  .legend { font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; line-height: 1.8; }
  .legend b { color: var(--ink); }

  .verdict {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: #F0FDF4; border: 1px solid #BBF7D0; font-size: 13.5px;
  }
  .verdict b { color: #15803D; }
  .verdict.warn { background: #FFFBEB; border-color: #FDE68A; }
  .verdict.warn b { color: #92400E; }
</style>
</head>
<body>

<header>
  <h1>Progressive Cloze Spelling — 挖空演算法預覽</h1>
  <p>每關挖一個拼寫模式，都挑權重最高的 · 無提示的整詞聽寫另開一個介面 · 英式拼寫 BrE</p>
</header>

<div class="wrap">

  <div class="panel">
    <h2>輸入單詞（一行一個，用逗號或空白分隔）</h2>
    <textarea id="input">apple, teacher, elephant, banana, rabbit, school, happy, jump, stop, thin, sing, sun, run, blue, queen, cake, night, phone, this, chalk, friend, fifteen, table, little, cat, box, sit, top</textarea>
    <p class="hint">
      試試加入你自己的詞：<code>apple</code> <code>photo</code> <code>climb</code> <code>busy</code> <code>rain</code>
      — 看演算法會挑哪個字母挖空
    </p>
  </div>

  <div class="panel">
    <h2>權重總表（依分數降序）</h2>
    <div class="scroll">
      <table class="rank-table" id="rankTable"></table>
    </div>
    <div class="legend">
      <b>類別圖例：</b>
      <span class="tag t1">一音多拼</span>
      <span class="tag t2">重複字母</span>
      <span class="tag t3">靜音/不發音</span>
      <span class="tag t4">元音組合</span>
      <span class="tag t5">r-控元音</span>
      <span class="tag t6">聲母/連綴</span>
      <br>
      <b>五個維度</b>（各 0–20，全部是「難度」指標）：g 字母複雜度 · a 歧義度 · u 位置難預測 · e 例外負荷 · m 構詞依賴
    </div>
  </div>

  <div id="cards" class="grid"></div>

</div>

<script type="module">
import { analyseWord } from '../assets/js/blanking.js';
import { PATTERNS_BY_WEIGHT, CATEGORIES } from '../assets/js/spelling-patterns.js';

// ── 權重總表 ──
const CAT_TAG = {
  vowel_team_ambig:      ['t1', '一音多拼'],
  doubled_lexical:       ['t2', '重複字母'],
  doubled_suffix:        ['t2', '重複字母'],
  magic_e:               ['t3', '靜音/不發音'],
  silent_letter:         ['t3', '靜音/不發音'],
  y_as_vowel:            ['t3', '靜音/不發音'],
  vowel_team:            ['t4', '元音組合'],
  r_controlled:          ['t5', 'r-控元音'],
  consonant_digraph:     ['t6', '聲母/連綴'],
  consonant_blend:       ['t6', '聲母/連綴'],
  single_vowel:          ['t6', '聲母/連綴'],
};

document.getElementById('rankTable').innerHTML =
  '<tr><th>模式</th><th>類別</th><th>權重</th><th>g</th><th>a</th><th>u</th><th>e</th><th>m</th><th>說明</th></tr>'
  + PATTERNS_BY_WEIGHT.map(p => {
      const [cls, label] = CAT_TAG[p.category] ?? ['t6', p.category];
      return `<tr>
        <td><code>${p.pattern === '_e_silent' ? 'VCe 靜音e' : p.pattern}</code></td>
        <td><span class="tag ${cls}">${label}</span></td>
        <td style="font-weight:800;color:var(--orange-dark)">${p.weight}</td>
        <td>${p.g}</td><td>${p.a}</td><td>${p.u}</td><td>${p.e}</td><td>${p.m}</td>
        <td style="font-size:12px;color:var(--ink-soft)">${p.note}</td>
      </tr>`;
    }).join('');

// ── 挖空字串渲染（空格用藍色標示，貼近遊戲內的呈現）──
function renderClozeHtml(word, blanks) {
  const set = new Set(blanks);
  return [...word]
    .map((ch, i) => set.has(i) ? '<span class="blank">_</span>' : ch)
    .join(' ');
}

// ── 詞卡片 ──
function renderCard(word) {
  const a = analyseWord(word);
  if (!a.levels.length) return '';

  const patSummary = a.patterns.length
    ? a.patterns.map(p => `${p.pattern}<span style="opacity:.55">(${p.weight})</span>`).join(' · ')
    : '<span style="opacity:.6">無 pattern → 用單字母退讓策略</span>';

  const levelsHtml = a.levels.map(L => {
    const cat = CATEGORIES[L.target.category];
    const pct = Math.min(100, L.target.weight);
    return `
    <div class="level lv${L.level}">
      <span class="lv-tag">L${L.level}</span>
      <span class="cloze">${renderClozeHtml(L.word, L.blanks)}</span>
      <span class="lv-info">
        <span class="pat">${L.target.pattern}</span>
        <span class="wt">權重 ${L.target.weight}</span>
        <div class="wt-bar" style="--pct:${pct}%"></div>
        <span class="nm" title="${(L.target.note || '').replace(/"/g,'&quot;')}">${L.target.note || cat?.label || ''}</span>
      </span>
    </div>`;
  }).join('');

  const graphemes = a.graphemes
    .map(g => `<span class="gch ${g.kind === 'pattern' ? 'pat' : ''}">${g.text}</span>`).join('');

  // 判斷提示：關數是否合理
  const nPat = a.patterns.length;
  let verdict = '';
  if (nPat >= 3) {
    verdict = `<div class="verdict"><b>${nPat} 個高權重模式</b> → 3 關都用不同模式，層次最完整。</div>`;
  } else if (nPat === 2) {
    verdict = `<div class="verdict"><b>只有 2 個 pattern</b> → L1、L2 各挖一個，沒有第三關。</div>`;
  } else if (nPat === 1) {
    verdict = `<div class="verdict warn"><b>只有 1 個 pattern（${a.patterns[0].pattern}）</b> → L1 挖它，L2 用單字母退讓補。</div>`;
  } else {
    verdict = `<div class="verdict warn"><b>詞內沒有任何 pattern</b> → 全部靠單字母退讓，最多 2 關。</div>`;
  }

  return `
  <article class="word-card">
    <header>
      <span class="w">${a.word}</span>
      <span class="len">${a.length} 字母</span>
      <span class="len">${a.levels.length} 關</span>
    </header>
    <div class="body">
      <div class="graphemes"><span class="lbl">切分</span>${graphemes}</div>
      <div class="graphemes"><span class="lbl">模式</span>
        <span style="font-size:12.5px;color:var(--ink-soft)">${patSummary}</span>
      </div>
      ${levelsHtml}
      ${verdict}
      <details>
        <summary>展開完整說明</summary>
        <div class="note-full">
          ${a.patterns.map(p => `<b style="color:var(--orange-dark)">${p.pattern}</b>（權重 ${p.weight}）— ${p.note}<br>`).join('')}
          ${a.patterns.length ? '' : '此詞沒有可辨識的拼寫模式，挖空目標由單字母啟發式決定。'}
        </div>
      </details>
    </div>
  </article>`;
}

function render() {
  const words = document.getElementById('input').value
    .split(/[\s,，]+/)
    .map(w => w.trim().toLowerCase())
    .filter(w => /^[a-z]+$/.test(w));

  const seen = new Set();
  const uniq = words.filter(w => !seen.has(w) && seen.add(w));

  document.getElementById('cards').innerHTML =
    uniq.map(renderCard).join('')
    || '<p style="color:var(--ink-soft)">請輸入至少一個英文字母的單詞。</p>';
}

document.getElementById('input').addEventListener('input', render);
render();
</script>

</body>
</html>
