<!-- ★ 快取破壞守衛：靜態站沒有 build step，瀏覽器會長期快取舊 .js。
     改了程式碼但使用者跑舊檔，症狀會被誤判成「修正沒生效」。
     版本不一致就強制重整。改程式碼後請同步更新 config.js 的 BUILD_ID。 -->
<script>
(function () {
  var BUILD = '2026-11-25-r79';
  var KEY = 'pcs.build';
  try {
    var seen = localStorage.getItem(KEY);
    if (seen === BUILD) return;
    localStorage.setItem(KEY, BUILD);
    if (seen && seen !== BUILD) {
      // ★ 2026-10-16 修正：原本是 pathname + search + '?_r=' + ...
      //   → 當網址本來就有 query（例如 ?pin=1234 分享連結）會變成
      //     "?pin=1234?_r=1759..."，兩個問號 → URLSearchParams 取到的 pin
      //     變成 "1234?_r=1759..." → PIN 格式校驗失敗 → 學生進不了課程。
      //   現在用 URL API 正確合併，並保留原本的 query。
      var u = new URL(location.href);
      u.searchParams.set('_r', String(Date.now()));
      location.replace(u.pathname + u.search + u.hash);
    }
  } catch (e) { /* private mode：略過 */ }
})();
</script>

<!-- ★ 載入失敗提示：module 語法錯誤時瀏覽器不會報錯到 UI，
     這裡用一個全域錯誤監聽器把問題顯式呈現出來。 -->
<script>
window.__pcsFatal = function (msg) {
  var d = document.getElementById('pcsFatal');
  if (!d) {
    d = document.createElement('div');
    d.id = 'pcsFatal';
    d.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:9999;padding:14px 16px;' +
      'background:#FEE2E2;border:2px solid #DC2626;border-radius:10px;color:#7F1D1D;' +
      'font:600 13px/1.6 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.2)';
    document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
    if (document.body) document.body.appendChild(d);
  }
  d.textContent = 'PCS could not start: ' + msg;
};
window.addEventListener('error', function (e) {
  if (e.target && e.target.tagName === 'SCRIPT') {
    window.__pcsFatal('a script failed to load (' + (e.target.src || 'inline') + ')');
  }
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e.reason;
  if (r && r.message && /import|module|syntax/i.test(r.message)) {
    window.__pcsFatal(r.message);
  }
});
</script>

<script type="module">
import { PCS_CONFIG } from './assets/js/config.js?v=2026-11-25-r79';
import { diagnose } from './assets/js/blanking.js?v=2026-11-25-r79';
import { localWordBank, loadWordList, analyseItem, buildItemInline, composeLevel, levelCountFor } from './assets/js/wordbank.js?v=2026-11-25-r79';
import { emojiForWord } from './assets/js/emoji.js?v=2026-11-25-r79';
import {
  initState, nextItem, recordAnswer, markMastered, queueNextLevel, isFinished,
  progress, summarise, serialise, deserialise,
  masteryFor, setTargetMastery, makeRng,
} from './assets/js/scheduler.js?v=2026-11-25-r79';
import { speakSentenceAndWord, speakWord, stopSpeaking, primeSpeech, speechStarted } from './assets/js/speech.js?v=2026-11-25-r79';
import { playCorrect, playWrong, playComplete, playTap, unlockAudio } from './assets/js/sfx.js?v=2026-11-25-r79';
import { recordExposure } from './assets/js/exposure.js?v=2026-11-25-r79';
import { enqueue, setBadgeTranslator, refreshBadge } from './assets/js/outbox.js?v=2026-11-25-r79';
import { confettiBurst, confettiCelebrate } from './assets/js/confetti.js?v=2026-11-25-r79';
import { initLang, t, applyI18n, mountLangToggle } from './assets/js/i18n.js?v=2026-11-25-r79';
import {
  scoreRound, loadMyScore, addScore, resetMyScore, fetchClassRanking, myRank, buildRankSession,
  subscribeClassRanking, todayKey,
} from './assets/js/leaderboard.js?v=2026-11-25-r79';

const CFG = PCS_CONFIG.experiment;
initLang();
// ★ outbox 不 import i18n（避免 ?v= 造成第二個模組實例），改由這裡注入 t()。
//   注入後它會立刻重畫一次徽章，所以順序放在 initLang() 之後。
setBadgeTranslator(t);
refreshBadge();

const student = JSON.parse(sessionStorage.getItem('pcs.student') || '{}');

// ★ sessionId 在這裡當場生成，學生不需要知道它的存在。
//   組成：課程 PIN + 班號 + 日期 → 同一位學生同一天在同一課程只有一份成績。
const today = (() => {
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
})();
const sessionId = `${student.pin || 'local'}_${student.classNo || 'x'}_${today}`;

// ★★ 2026-11-20：這一局的「局號」。
//   sessionId 只到「日期」，同一天重玩會撞同一個 key ——
//   舊版因此讓分數在 localStorage 裡累加，但正確率每局歸零，
//   寫進排行榜就變成「points 是今天總和、accuracy 是最後一局」。
//   現在每一局有自己的局號：分數每局歸零、rankBoard 用 `_r<局號>` 分開存，
//   排行榜再取「最高分那一局」→ 兩個數字永遠同一局。
const RUN_KEY = `pcs.run.${sessionId}`;
function runNo() {
  try { return Number(localStorage.getItem(RUN_KEY) || 0) || 1; } catch { return 1; }
}

// ★ recordExposure 需要 sessionId 與 classNo 都在 student 物件裡。
//   直接補上去，避免每次呼叫都要記得傳。
student.sessionId = sessionId;

// 課程詞彙（由 index.html 從 Firestore 讀好傳過來）
const ASSIGNMENT_ITEMS = JSON.parse(sessionStorage.getItem('pcs.items') || '[]');

// ★★★ Advanced mode（老師在建立 assignment 時勾選）
//
//   這份 assignment 改成考試模式：整個詞自行填寫，每個詞只出現一次。
//   與 progressive 模式的差異全部集中在少數幾個判斷點（皆標記 ★ADV）：
//     render()          → buildAdvancedLevel() 產生「全挖」的題目
//     scheduler 用法→ 不排重測、不排 level 佇列（每詞只一次）
//     submit()          → 比對「整串答案」而不是逐字母
//     recordExposure()  → mode 記為 'dictation'（分析時可區分）
//
//   為什麼預設關閉：日常練習需要 L1/L2/L3 的漸進與回溯重測，
//   那是 PCS 的研究核心。Advanced 是給小考／階段測驗用的另一種形態。
const ADVANCED = !!student.advanced;

// ★★★ 難度（2026-11-24 · r68）
//
//   學生一進課程先選 Easy / Difficult，兩種難度**規則不同、成績分開記**：
//
//     Easy      → 每題只挖「一個結構」（oo 這種跨 2 格仍算一個空）
//                 每個詞只考兩遍（答對 → 換另一個結構；答錯 → 同一結構補考一次）
//                 不進回溯佇列，所以題量固定、可預期
//     Difficult → 原規則：每題 2–3 個空、最多 3 關、答錯的結構會回溯重測
//
//   為什麼要分開記：Easy 的題量本來就少，跟 Difficult 混在同一張榜上，
//   等於用「做得多」而不是「做得好」排名。所以排行榜分成上下兩欄。
//
//   DIFF = null 表示「還沒選」→ 進課程時先出選擇畫面。
//   續玩（localStorage 有存檔）時直接沿用存檔裡的難度，不再問一次。
let DIFF = null;
const isEasy = () => DIFF === 'easy';
/** 傳給 composeLevel / levelCountFor 的難度參數 */
//
// ★ r73：Difficult 也改成「每個詞兩關」。
//   之前是 3 關（每關 2–3 個空）—— 老師的意見是「difficult 也考兩次就好」。
//   minLevels: 2 是為了短詞（例如 fly / cat 這種靶點池很小的詞）：
//   levelCountFromPool 原本會算成只有 1 關，等於整個詞只出現一次。
//
//   補考由 retryQueue 負責：哪一關答錯，那一關就在整局最後再考一次
//   （見 retryLevel 與 scheduler 的 retryAllowed=false）。
const levelOpts = () => (isEasy()
  ? { targets: 1, maxLevels: 2, byTargets: true }
  : { maxLevels: 2, minLevels: 2 });

/**
 * ★ r73：這一局的「關卡總數」與「已完成關卡數」—— 進度條用。
 *
 * 舊進度條用 mastered/(words+mastered)，分母自己會長大，所以永遠走不到頭。
 * 現在改成「關卡為單位」：
 *   total = Σ 每個詞的關卡數（跟出題用的是同一個 levelCountFor）
 *   done  = Σ 每個詞已完成的關卡數（整詞 master 了就記滿）
 * 分母固定，只會單調往上；整局做完就是 100%。
 *
 * 這裡快取一份：updateChrome 每次作答都會呼叫，analyseItem 不便宜。
 * key 含銀行內容與難度 → 換作業、換難度、換局都會自動重算。
 */
let planCache = null;
function runPlan() {
  const key = `${DIFF}|${ADVANCED ? 'adv' : 'prog'}|${bank.map(w => w.wordId).join(',')}`;
  if (planCache && planCache.key === key) return planCache;

  const perWord = new Map();
  let total = 0;
  for (const w of bank) {
    const n = ADVANCED ? 1 : Math.max(1, levelCountFor(analyseItem(w.word), levelOpts()));
    perWord.set(w.wordId, n);
    total += n;
  }
  planCache = { key, perWord, total };
  return planCache;
}

/**
 * ★ 2026-11-25（r72）：這一題的隨機來源。
 *
 * 由 (局種子 | wordId | level) 派生 —— 也就是說：
 *   · 換一局 → 種子變 → 詞序與挖空全部重新洗（老師要的「不要每次都一樣」）
 *   · 同一局、同一個詞、同一關 → 種子固定 → 學生重新整理頁面不會換題
 *
 * 若直接用 Math.random，刷新一次就換一組空格，等於讓學生可以「刷題」。
 */
function rngFor(wordId, level) {
  return makeRng(`${state?.rngSeed ?? 'norun'}|${wordId}|${level}`);
}

// ★★★ 未登入閘門（2026-10-16 補）
//
//  問題：這頁原本沒有任何「沒有學生身分」的檢查。直接開 play.html 時
//    · student = {}（sessionStorage 空的）
//    · ASSIGNMENT_ITEMS = [] → init() 會 fallback 到內建詞庫
//    → 學生**不輸入 PIN 也能開玩**，而且 exposure / session 會以
//      空姓名、空學號、空 PIN 寫進 Firestore → 污染研究資料、
//      後台出現來源不明的記錄、排行榜出現無名條目。
//
//  解法：缺 PIN 或缺課程詞彙 → 直接送回登入頁。
//    （內建詞庫兜底仍然保留，但只服務「已登入、老師還沒建課」的學生）
const NO_SESSION = !student.pin || !ASSIGNMENT_ITEMS.length;
if (NO_SESSION) {
  console.warn('[PCS] 沒有學生身分或課程詞彙，送回登入頁');
  location.replace('index.html');
}

/**
 * 造一個「整詞全挖」的 level 物件（格式與 analyseItem 的輸出相同，
 * 所以 buildItemInline / submit / exposure 都不用改）。
 *
 * - blanks：全部字母的位置
 * - targetWord：去掉冠詞的內容詞（a cake shop → cake shop）
 * - words：逐詞的字母索引分组，讓 UI 能在詞與詞之間畫分隔
 */
function buildAdvancedLevel(rawWord) {
  // ★ 去掉冠詞 / 介詞，學生要填的是「cake shop」不是「a cake shop」
  const parts = String(rawWord || '').trim().toLowerCase()
    .split(/\s+/).filter(Boolean);
  const LEAD = new Set(['a', 'an', 'the']);
  const content = parts.length > 1 && LEAD.has(parts[0]) ? parts.slice(1) : parts;
  const targetWord = content.join(' ');

  if (!targetWord) return null;

  // blanks：目標詞（targetWord，含空格）裡所有要挖的位置 → 給輸入框用
  // words：逐詞的「詞內」字母序號（0-based）→ 給 phrase.js 的
  //        buildAdvancedInline 用（那邊是逐詞渲染，不能用全域偏移）
  // ★ 兩套坐標系不同，寫錯的話第二個詞就不會被挖到（實測踩過）。
  const words = [];
  const blanks = [];
  let pos = 0;
  for (const w of content) {
    const group = [];
    for (let i = 0; i < w.length; i++) {
      group.push(i);              // 詞內序號
      blanks.push(pos + i);       // targetWord 序號
    }
    words.push(group);
    pos += w.length + 1;          // +1 = 空格
  }

  return {
    level: 1,
    blanks,
    // 顯示字串：整個詞都用底線（顯示時會被 slot-input 取代）
    display: targetWord.split('').map(() => '_').join(' '),
    target: {
      pattern: 'advanced_all',
      category: 'whole_word',
      weight: 1,
    },
    targetWord,
    words,                          // ★ UI 用來畫詞間分隔
    isPhrase: content.length > 1,
    advanced: true,
    // ★ 冠詞（a / an / the）不算在 targetWord 裡，但方框列最前面要照樣顯示
    //   （與 progressive 一致 → "a cake shop" 整列讀起來是完整題目）。
    article: parts.length > 1 && LEAD.has(parts[0]) ? parts[0] : null,
  };
}

const STAGE = document.getElementById('stage');

let bank = [], state = null, current = null;
let attempts = {}, hadError = false, questionStart = 0, answeredAll = false;

// ══════════════════════════════════════════════
// Boot
// ══════════════════════════════════════════════
mountLangToggle(document.getElementById('langSlot'));
// ★ 首屏也要套一次：否則 localStorage 已是 zh 的使用者重新整理後，
//   靜態的 data-i18n / data-i18n-attr（例如分數的 tooltip）仍是英文原字。
applyI18n(document);
document.addEventListener('pcs:lang-changed', () => {
  applyI18n(document);
  fillSessionChip();      // ★ 晶片上的「學號」標籤也要跟著語言切換
  // ★ 只有在「已結束」時才重畫結算頁。
  //   否則切換語言會把進行中的題目跳到結算畫面。
  if (state && isFinished(state)) renderResult();
  else if (current) { drawQuestion(); updateChrome(); }
  else { updateChrome(); }
});

let __firstSpeechTried = false;
['touchstart', 'click', 'keydown'].forEach(ev =>
  window.addEventListener(ev, () => {
    primeSpeech();
    unlockAudio();
    /* ★ 2026-11-20：iOS 上「首屏自動朗讀」發生在任何手勢之前，會被系統吃掉。
       孩子看到新詞卻沒聽到聲音，就會以為喇叭壞了。
       所以在第一次觸碰時補唸一次 —— 只唸一次，不重複。 */
    if (__firstSpeechTried) return;
    __firstSpeechTried = true;
    setTimeout(() => {
      if (speechStarted() || !current) return;
      // ★ 不要插隊：如果引擎已經在唸（就是剛剛那次自動朗讀，只是還沒出聲），
      //   再唸一次會把第一句 cancel 掉，聽起來像「卡一下才唸」。
      try { if (speechSynthesis.speaking || speechSynthesis.pending) return; } catch { }
      try { speakWord(current.targetWord, { lang: PCS_CONFIG.ui.lang }); } catch { /* 忽略 */ }
    }, 240);
  }, { once: true, passive: true }));

// ★ 頂部顯示「目前進入的 assignment 的 PIN」與「學生名字 / 學號」
//   （學生答題時一眼看到自己是在哪個課程、用哪個名字，老師巡堂也方便核對）
//
//   ★ 命名勘誤：student.classNo 存的其實是「學號 Student No.」
//     （來源是 index.html 的 join 表單，欄位標籤就是 "Student No."），
//     不是班級號 —— 班級名稱另存於 student.className（由老師建立課程時指定）。
//     因此這裡顯示時用正確的「No.」標籤，不再寫成「班#」。
function fillSessionChip() {
  const chip = document.getElementById('sessionChip');
  if (!chip) return;
  const name = student.studentName || student.name || '';
  const pin = student.pin || '';
  const no = student.classNo != null ? student.classNo : '';
  // ★ 姓名和 PIN 都沒有 → 這是未登入狀態（即將被跳轉），
  //   不要把殘缺的 "🙋 PIN" 顯示出來。
  if (!name && !pin) { chip.hidden = true; return; }
  const scName = document.getElementById('scName');
  const scPin = document.getElementById('scPin');
  const scNo = document.getElementById('scClass');
  if (scName) scName.textContent = name;
  if (scPin) scPin.textContent = pin;
  if (scNo) scNo.textContent = no ? ` · ${t('chip.no', { n: no })}` : '';
  chip.hidden = false;
}
fillSessionChip();



async function init() {
  // ★ 未登入 → 什麼都不做（上面已經 location.replace 回登入頁）。
  //   少了這道短路，init() 會繼續跑 loadWordList() 把內建詞庫載進來，
  //   在跳轉發生前先把一局遊戲開起來。
  if (NO_SESSION) return;

  // ★ 2026-11-20：一進課程就把排行榜釘在旁邊（比賽時常亮、即時更新）
  pinRanking();

  // ★ 優先用「老師派的課程詞彙」；沒有課程（老師沒建）才退回內建詞庫，
  //   這樣學生端永遠不會開天窗。
  bank = ASSIGNMENT_ITEMS.length
    ? ASSIGNMENT_ITEMS.map(toWordObj)
    : await loadWordList({ n: CFG.targetWords, seed: CFG.shuffleSeed });

  const saved = loadSavedState();
  const ids = new Set(bank.map(w => w.wordId));
  if (saved && saved.wordIds?.length) {
    // 存的狀態必須包含目前詞庫的詞，否則接不上（換課程了）
    if (saved.wordIds.every(id => ids.has(id))) {
      state = deserialise(saved);
      // ★ 續玩：難度沿用存檔，不再問一次（否則學生會以為進度被重置）
      DIFF = state.difficulty;

      // ★★ 續玩時，把「老師後來才加進去的詞」補進這一局。
      //
      //   原本只檢查「存檔的詞都在詞庫裡」(⊆)，於是老師新增的詞
      //   永遠不會被發出來 —— 症狀：學生明明做完了畫面上所有題目，
      //   後台卻顯示 unfinished ／「N words not attempted」
      //   （老師會問「為什麼沒讓我寫那兩個詞」）。
      //
      //   現在把缺的詞接在隊尾：這一局仍然會出到它們，進度不會丟。
      //   ※ 同一天同一班號重入（sessionId 相同）才會走到這裡。
      const known = new Set(state.order);
      const added = bank.map(w => w.wordId).filter(id => !known.has(id));
      if (added.length) {
        state.order = [...state.order, ...added];
        state.wordIds = [...new Set([...state.wordIds, ...added])];
        console.warn('[PCS] 這份作業新增了', added.length, '個詞，已接進本局：', added);
      }

      render();
      return;
    }
    console.warn('[PCS] 存檔與目前作業不一致，直接開新的一局');
  }

  // ★ 全新的一局 → 先讓學生選難度，選完才建立遊戲狀態。
  //   以前這裡直接 initState + render，等於預設困難；現在難度是學生的選擇。
  renderDifficultyPicker();
}

/**
 * 開始新的一局（選難度之後、或結算頁的「再玩一次 / 繼續挑戰困難」）。
 *
 * @param {'easy'|'difficult'} diff
 * @param {{wrong?:Object, neverTested?:string[]}|null} carry 上一局留下的重點
 */
function startNewRun(diff, carry = null) {
  DIFF = diff === 'easy' ? 'easy' : 'difficult';

  // ★ 新的一局 → 局號 +1、分數歸零
  try {
    const cur = Number(localStorage.getItem(RUN_KEY) || 0) || 0;
    localStorage.setItem(RUN_KEY, String(cur + 1));
  } catch { /* 忽略 */ }
  resetMyScore(student.sessionId);

  state = initState(bank.map(w => w.wordId), { advanced: ADVANCED, difficulty: DIFF });
  applyCarry(state, carry);
  saveState();
  render();
}

/**
 * 重玩時把上一局的重點帶過來：
 *   ① 之前答錯的結構 → 標成 fail（組裝時 +12，優先再挖）
 *   ② 上一局已經答對的結構 → 標成 pass（×0.12，幾乎不再挖）→ 把名額留給沒考過的
 *   ③ 上一局沒考到的詞 → 排到最前面
 *
 * ★ ② 為什麼重要：Easy 每個詞只考兩遍，一個詞往往只測了 2 個結構，
 *   其他 5、6 個結構**從沒考過**。重玩時若不記得「哪些已經會了」，
 *   組裝會再挑一次最高權重的那兩個 —— 學生會覺得「怎麼又是這兩個」。
 *   記住 pass 之後，重玩自動換成沒考過的那些。
 *
 *   順序：先 pass 再 fail。同一個結構若兩局結果相反，以「錯」為準（複習優先）。
 */
function applyCarry(state, carry) {
  if (!carry) return;
  for (const [wordId, keys] of Object.entries(carry.passed ?? {})) {
    if (keys?.length) setTargetMastery(state, wordId, keys, 'pass');
  }
  for (const [wordId, keys] of Object.entries(carry.wrong ?? {})) {
    if (keys?.length) setTargetMastery(state, wordId, keys, 'fail');
  }
  const never = new Set(carry.neverTested ?? []);
  if (never.size) {
    state.order = [
      ...state.order.filter(id => never.has(id)),
      ...state.order.filter(id => !never.has(id)),
    ];
  }
}

/** 從剛結束的一局裡抽出「重玩要優先處理的東西」 */
function buildCarry(st) {
  if (!st) return null;
  const wrong = {};
  for (const [wordId, set] of (st.wrong ?? new Map())) {
    const keys = [...set];
    if (keys.length) wrong[wordId] = keys;
  }
  // 已經答對的結構（整關全對時標的 pass）
  const passed = {};
  for (const [wordId, m] of (st.targetMastery ?? new Map())) {
    const keys = [...m].filter(([, v]) => v === 'pass').map(([k]) => k);
    if (keys.length) passed[wordId] = keys;
  }
  const neverTested = (st.order ?? []).filter(id => (st.exposureCount?.get(id) ?? 0) === 0);
  return { wrong, passed, neverTested };
}

/**
 * 跳過無法出題的詞。
 * ★ 必須同時處理兩條路徑，否則會無限迴圈：
 *   - 新詞：把 poolIndex 往前推，標記為已掌握（它不會再被取出來）
 *   - 重測：retryQueue 裡的項目必須移除，否則 nextItem 會一直回傳它
 */
function skipUnplayable(wordId, item) {
  if (item?.kind === 'retry') {
    state.retryQueue = state.retryQueue.filter(q => q.wordId !== wordId);
  }
  if (item?.kind === 'advance') {
    state.levelQueue = state.levelQueue.filter(id => id !== wordId);
  }
  if (item?.kind === 'new') {
    state.poolIndex = Math.max(state.poolIndex, state.order.indexOf(wordId) + 1);
  }
  state.masteredWords.add(wordId);
  saveState();

  // 避免一次跳太多詞造成畫面空白太久；全部跳完就結束這一局
  setTimeout(render, 0);
}

/** Firestore 的 assignment item → 遊戲用的 wordObj */
function toWordObj(it) {
  return {
    wordId: it.itemId || `a_${String(it.word).replace(/[^a-z]+/g, '_')}`,
    word: String(it.word || '').trim().toLowerCase(),
    sentences: Array.isArray(it.sentences) ? it.sentences.filter(Boolean) : [],
    imageDataUrl: it.imageDataUrl || null,
    imageEmoji: it.imageEmoji || null,
    category: it.category || 'place',
    active: true,
  };
}

const loadSavedState = () => {
  try {
    const raw = localStorage.getItem(`pcs.state.${student.sessionId}`);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
};

function saveState() {
  try {
    localStorage.setItem(`pcs.state.${student.sessionId}`, JSON.stringify(serialise(state)));
  } catch (e) { console.warn('save failed', e); }
}

/**
 * ★ 難度選擇畫面（r68）
 *
 * 學生一進課程就看得到，選完才開始第一題。
 * 為什麼不在登入頁選：登入頁只管「你是誰」，難度是「這一輪怎麼練」，
 * 換 difficulty 時不必重新輸入 PIN。
 */
function renderDifficultyPicker() {
  DIFF = null;

  //   原本每格下面還有一段英文說明，小朋友根本不讀，反而讓兩個選項變小。
  STAGE.innerHTML = `

/**
 * ★ 重測關卡的組裝（r67）
 *
 * 這裡只做一件事：把「上次答錯的結構」重新挖出來，剩下的名額重新分配。
 *
 * 為什麼不能沿用整組快照（item.spec）：
 *   快照是「失敗那一刻的整組空」，裡面混著學生當時**答對**的字母。
 *   原樣重播 = 答對過的字母再考一次，學生會覺得「我明明寫對了」。
 *   （老師的原話就是這句。）
 *
 * 為什麼不能乾脆完全重新組裝：
 *   佇列項的 key 是 wordId:level:probeIndex，靠「那一格是空格」才能被答到、
 *   才能被刪掉。重新組裝時若那一格變成給定字母，佇列項永遠消不掉 →
 *   這一局結束不了。所以用 mustInclude 把它鎖進空格裡。
 */
function retryLevel(item, analysis, wordId) {
  const mastery = masteryFor(state, wordId);

  // 同一個詞、同一關的所有待重測項 —— 一起挖出來，一次清乾淨。
  // （一個 pattern 跨 2 格會有 2 條佇列項，分兩次問是同一個結構考兩遍。）
  const pending = (state.retryQueue || []).filter(
    q => q.wordId === wordId && q.level === item.level,
  );
  const keys = pending.map(q => q.targetKey).filter(Boolean);
  const probes = [item.probeIndex, ...pending.map(q => q.probeIndex)]
    .filter(n => Number.isInteger(n));

  const out = composeLevel(analysis, item.level, mastery, {
    mustInclude: keys,
    mustIncludeProbes: probes,
    // Easy：補考也只挖那一個結構（不要補考時又冒出一堆空）
    targets: isEasy() ? 1 : null,
    // ★ r72：同一局的同一題要穩定，用派生種子
    rng: rngFor(wordId, item.level),
  });

  // 保險：要重測的那一格必須真的是空格，否則退回整組快照（極舊存檔才走這裡）
  if (out && Array.isArray(out.blanks) && out.blanks.includes(item.probeIndex)) return out;
  if (item.spec && (item.spec.blanks ?? []).includes(item.probeIndex)) return item.spec;
  return out ?? item.spec ?? null;
}

// ★ 自動朗讀用的去重：只在「換了一個新單詞」時才讀，
//   同一個詞的 L2 / L3 不重複朗讀，避免課堂上一直重複出聲。
let lastAutoSpokeWordId = null;

function render() {
  // ★★ 2026-11-25：先看有沒有「上一次發出去、還沒作答」的那一題（續玩用）。
  //
  //   為什麼需要：advance / retry 的題目是從 levelQueue / retryQueue **取出即消失**，
  //   state 裡沒有任何「這一題正在作答」的紀錄。於是學生做到第 2 關按返回、
  //   再進來（頁面重新載入）時，三個佇列都是空的 → isFinished() 成立 →
  //   直接跳出結算頁（成績單寫「完成 0 個詞」），練習整個被吃掉。
  //   現在把當前題目存進 state.pendingItem，重新載入時先接回它。
  const resumed = state.pendingItem || null;
  let item = resumed;
  if (item) {
    state.pendingItem = null;          // 只接回一次，之後照正常流程
  } else {
    if (isFinished(state)) { renderResult(); return; }
    item = nextItem(state);
    if (!item) { renderResult(); return; }
  }

  const wordObj = bank.find(w => w.wordId === item.wordId);
  if (!wordObj) { state.poolIndex++; render(); return; }

  const analysis = analyseItem(wordObj.word);

  // ★★ 2026-11-24：關數與關內容分開。
  //
  //   舊版 analysis.levels 既是「總關數」又是「每關的題目」，
  //   所以出題只能 levels[level-1] —— 靜態、不可變。
  //   現在：
  //     lvTotal  = levelCountFor()  → 這個詞一共幾關（只依靶點池，一局內穩定）
  //     composeLevel()              → 這一關實際挖哪幾個字母（吃 mastery 記憶）
  const lvTotal = ADVANCED ? 1 : levelCountFor(analysis, levelOpts());

  // ★ 防呆：某些字串（例如 ping_pong、don't、t-shirt、單字母 a）
  //   產生 0 關。沒有關卡就沒辦出題目 —— 直接讀 lvl 會是 undefined，
  //   然後 `lvl.targetWord` 拋 TypeError，整局卡在「Loading failed」。
  //   這裡寧可跳過這個詞，也不要讓學生看到壞掉的畫面。
  if (!lvTotal) {
    console.warn('[PCS] 這個詞無法產生關卡，已跳過：', wordObj.word);
    skipUnplayable(wordObj.wordId, item);
    return;
  }

  // ★ Progressive 的核心：答對 L1 要接著做 L2，做完 L2 接 L3……
  //   而不是答對一次就把整個詞標記為「已掌握」。
  //   下一關 = 該詞目前已完成的關卡數 + 1。
  const done = state.levelProgress.get(wordObj.wordId) || 0;
  const level = item.kind === 'retry'
    ? item.level
    : Math.min(done + 1, lvTotal);
  const isAdvance = item.kind === 'advance';
  // ★★★★★ Advanced mode（整詞自行填寫的考試模式）
  //
  //  老師在建立 assignment 時勾選 Advanced mode，這份試卷就變成：
  //    · 例句照樣顯示（給語境）
  //    · 圖片照樣顯示
  //    · 單詞與詞組**全部**字母挖空成下劃線（不是只挖 pattern）
  //    · 每個詞只出現一次（沒有 L1/L2/L3 階梯、不重測）
  //
  //  作法：自己造一個「整詞全挖」的 level 物件，
  //  而不去改 analyseItem 的輸出 —— 這樣 progressive 模式完全不受影響。
  //
  // ★★★ 重測的空組：只鎖定「答錯的那個結構」，其餘重新組裝。
  //
  //   舊版直接拿 item.spec 原樣重播 —— 於是上一輪**已經答對**的字母
  //   也被再挖一次（老師原話：「oo 之前寫對了呀，為什麼還會再考一次，
  //   為什麼不把 oo 換成別的，比如摳 ride 裡面的詞，甚至是 sc」）。
  //
  //   現在：
  //     ① 把「同一個詞、同一關」所有待重測項的靶點都塞進來（保證那幾格是空格，
  //        佇列項才刪得掉，不會卡死）；
  //     ② 剩下的名額照常由 composeFromPool 補 —— 答對過的靶點已被 mastery
  //        壓到 0.12 倍，補進來的通常是這個詞裡還沒考過的另一個結構。
  //     ③ 最後驗一次：萬一那一格仍不是空格（極舊存檔），才退回整組快照。
  const lvl = ADVANCED
    ? buildAdvancedLevel(wordObj.word)
    : (item.kind === 'retry')
      ? retryLevel(item, analysis, wordObj.wordId)
      : composeLevel(analysis, level, masteryFor(state, wordObj.wordId),
          { ...levelOpts(), rng: rngFor(wordObj.wordId, level) });

  // ★ 最後一道保險： level 算成 0 或負數時會取到 undefined
  if (!lvl) {
    console.warn('[PCS] level 超出範圍，已跳過：', wordObj.word, level);
    skipUnplayable(wordObj.wordId, item);
    return;
  }

  const sents = wordObj.sentences?.length ? wordObj.sentences : ['___'];
  const sentence = sents[(item.exposureIndex ?? 0) % sents.length];
  const inline = buildItemInline(sentence, wordObj.word, lvl);

  // ★★ 例句挖空失敗時，絕對不能把整句原樣顯示出來。
  //   那等於直接把答案送給學生（例："I love cake shops." 讓人看見 shop 的 s）。
  //   寧可顯示一句不含目標詞的提示，也不要洩漏答案。
  const inlineOk = !!inline && inline.segments.some(s => s.t === 'slot');
  const safeSentence = inlineOk ? sentence : '_____';

  current = {
    item, wordObj, analysis,
    level: lvl.level,
    blanks: lvl.blanks,
    target: lvl.target,
    // ★ 本關的所有靶點（一關可能挖 2–3 個不同的語音結構）
    targets: lvl.targets ?? (lvl.target ? [lvl.target] : []),
    targetWord: lvl.targetWord || wordObj.word,
    // ★ADV 考試模式需要用到逐詞的字母索引（畫詞間分隔）
    levelObj: lvl,
    advanced: ADVANCED,
    lvTotal,
    sentence: inlineOk ? sentence : null,   // ★ null = 沒有可安全顯示的例句
    inline: inlineOk ? inline : null,
    exposureIndex: item.exposureIndex ?? 0,
  };

  attempts = {};
  hadError = false;
  answeredAll = false;
  questionStart = performance.now();

  // ★ 續玩接回來的那一題，不能再算一次曝光（第一次 render 時已經算過）
  if (!resumed) {
    state.exposureCount.set(wordObj.wordId, (state.exposureCount.get(wordObj.wordId) ?? 0) + 1);
  }

  // ★ 記住「這一題正在作答」—— 頁面被重新載入時要能接回同一題（見函式開頭）
  state.pendingItem = item;

  drawQuestion();
  updateChrome();
  saveState();
}

function drawQuestion() {
  const { wordObj, blanks, sentence, inline, item, targetWord } = current;

  // 進度：顯示目前是第幾關 / 這個詞共幾關，讓學生知道還有下一步
  const totalLv = current?.lvTotal ?? 1;
  // ★ADV 考試模式沒有「關卡」概念（每詞只出現一次），所以不顯示 Level chip，
  //   只保留進度（第 n / 共 m 題）。顯示「Level 1 of 2」會誤導學生以為還有下一關。
  const badge = item.kind === 'retry'
    ? `<span data-i18n="game.retry">Try again</span>`
    : `<span data-i18n="game.progress" data-n="${Math.min(state.poolIndex + 1, state.order.length)}" data-total="${state.order.length}"></span>`
      + (ADVANCED ? '' : `<span class="lv-chip">Level ${current?.level ?? 1} of ${totalLv}</span>`);

  // ★ Only the target word gets input boxes. No word is ever revealed in text.
  // ★ 用 CSS Grid 的兩列：第 1 列字母框、第 2 列答案格。
  //   每個位置都有答案格（沒錯時是空的），才能保證上下嚴格對齊。
  // ★ 每個位置都配一個同寬的答案格（id 對應字母位置），
  //   答錯時逐格填入正確字母 → 上下嚴格對齊，不會像浮動 pill 那樣偏移。
  //
  // ★★★ 每個字母位置做成一個「欄位容器」（.cell），上下兩格放在同一個容器裡。
  //
  // 為什麼不用「input 與 answer 交錯 + grid-row 指定行號」：
  //   那個做法依賴 grid 的 auto-placement 演算法，把元素依序填進欄位。
  //   ★ 在 Safari（iPad 學生端）上，`.word-sep` 這種「跨兩列」的元素會讓
  //     auto-placement 算錯 —— 結果下方答案格跟上方輸入框錯開一格，
  //     學生看到「上排 s t a t i o、下排 s t a t i」對不上。
  //   （症狀：只有詞組、只有 iPad、只有 advanced/多詞時會出現。）
  //
  //   包成 .cell 之後，每一欄是一個獨立的 flex column，
  //   上下的對齊由容器內部保證，完全不依賴 grid 的自動排版。
  const boxes = [...targetWord].map((ch, i) => {
    // 空格：只留一個分隔欄（上下都空白）
    if (ch === ' ') {
      return `<span class="cell cell-sep" aria-hidden="true"></span>`;
    }
    const upper = blanks.includes(i)
      // ★ r73：格子改成 readonly + inputmode="none" ——
      //   真正的鍵盤在 #kbSink 上（見上面那段說明）。
      //   格子只負責「顯示字母 + 被點」，所以它不該自己叫出鍵盤，
      //   否則 iPad 上會出現「兩個輸入焦點打架、鍵盤一閃就收」。
      ? `<input class="slot-input" type="text" inputmode="none" readonly
           maxlength="1" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" data-index="${i}" aria-label="Letter ${i + 1}">`
      : `<span class="slot-given">${escapeHtml(ch)}</span>`;
    return `<span class="cell">${upper}<span class="slot-answer" id="ans-${i}" aria-hidden="true"></span></span>`;
  }).join('');

  const inlineHtml = inline
    ? inline.segments.map(s => {
        if (s.t === 'text') return escapeHtml(s.v);
        if (s.t === 'given') return `<span class="given">${escapeHtml(s.v)}</span>`;
        // ★ data-bi = 目標詞的字母序號，讓 syncInline 能正確配對
        //   （同一個詞在句中出現多次時，順序配對會錯位）
        return `<span class="slot-inline" data-bi="${s.index}"></span>`;
      }).join('')
    // ★ 挖不到目標詞 → 只顯示提示，不顯示原句（否則答案直接露出來）
    : '<span class="given">_____</span>';

  // ★ emoji 解析順序：
  //   1. 老師上傳的圖片（imageDataUrl）
  //   2. 課程建立時就存好的 emoji（imageEmoji）
  //   3. 現場用 emojiForWord(word) 解析 —— 這一步是舊課程的後備：
  //      以前的版本沒把 emoji 寫進 assignment，只靠 category 猜，
  //      而 category 缺席時一律當 'place' → 每個詞都變 🏠。
  //      改成「用詞本身去查」，a cake shop 就會拿到 🍰。
  const fig = wordObj.imageDataUrl
    ? `<img src="${wordObj.imageDataUrl}" alt="">`
    : `<div class="placeholder">${wordObj.imageEmoji || emojiForWord(wordObj.word, wordObj.category)}</div>`;

  const n = blanks.length;
  const hintKey = n > 1 ? 'game.needLetters' : 'game.needLetter';

  // ★ 冠詞（a / an / the）以「已給定字母框」的形式排在題目最前面 ——
  //   每一顆都跟後面的字母框**同款同尺寸**，整列讀起來就是
  //   "a cake shop" / "an art room" / "a cinema"，學生看到的是完整題目，
  //   只有被挖空的那幾格要填。
  //
  //   ★ 為什麼不是一顆圓形小 pill：pill 的字號是字母的 0.6 倍，
  //     同一列會出現兩種大小的字（"a cake shop" 的 a 比 c / a / k 小一號），
  //     使用者直接回報「那個 a 的大小又不一樣了」。
  //     現在冠詞逐字母走 .art-given（與 .slot-given 同款），尺寸由 CSS 保證一致。
  //
  //   ★ 為什麼不分「短語 / 單詞」：同一個作業裡若 "a cake shop" 顯示 a、
  //     但 "a cinema" 不顯示，老師會看到兩種格式。所以只要該題有冠詞就顯示，
  //     整份作業的方框列長得一模一樣。
  //
  //   ★ 冠詞與內容詞之間放一個 .cell-sep：與「詞與詞」的間隔相同
  //     （a | cake shop），整列的字距讀起來才像一句正常的短語。
  const artWord = current.levelObj?.article || '';
  const artPrefix = artWord
    ? [...artWord]
        .map(ch => `<span class="cell"><span class="art-given">${escapeHtml(ch)}</span></span>`)
        .join('')
      + `<span class="cell cell-sep" aria-hidden="true"></span>`
    : '';

  STAGE.innerHTML = `
    <span class="level-tag">${badge}</span>

    <div class="word-figure">${fig}</div>

    <div class="sentence-card">
      <div class="sentence-row">
        <div class="sentence-text">${inlineHtml}</div>
        <button class="speaker-btn" id="speakBtn" type="button"
                aria-label="Listen" data-i18n-attr="aria-label:game.listen">🔊</button>
      </div>
    </div>

    <div class="cloze-row" id="clozeRow">${artPrefix}${boxes}</div>

    <div class="diagnosis idle" id="diag" data-i18n="${hintKey}" data-n="${n}"></div>

    <div class="actions">
      <button class="btn-skip" id="skipBtn" type="button" data-i18n="game.skip">Skip</button>
      <button class="btn-skip" id="retryBtn" type="button" data-i18n="game.retry" hidden>Try again</button>
      <button class="btn-submit" id="submitBtn" type="submit" disabled data-i18n="game.check">Check</button>
    </div>
  `;

  applyI18n(STAGE);
  // progress label 需要插值
  const lt = STAGE.querySelector('.level-tag span[data-i18n="game.progress"]');
  // ★ 這裡必須跟 badge 用同一個 Math.min() —— poolIndex 在 nextItem() 裡
  //   已經先++ 了（表示「這個詞已發出」），所以 +1 會比實際多 1。
  //   Advanced mode 尤其明顯：2 個詞的最後一題會顯示「Word 3 of 2」。
  if (lt) lt.textContent = t('game.progress', {
    n: Math.min(state.poolIndex, state.order.length),
    total: state.order.length,
  });
  const dg = STAGE.querySelector('#diag');
  if (dg) dg.textContent = t(hintKey, { n });

  wireQuestion();
  fitClozeRow();          // ★ 依詞長自動調整格寬 → 保證單行、上下對齊
  focusFirst();

  // ★ 新單詞出現時自動朗讀一次 —— 只讀「單詞 / 詞組」本身，不讀例句。
  //   - 想聽「例句 + 單詞」時，由學生自己按右下角的小喇叭（見下方 speakBtn 的 click）。
  //   - 只在「換了新單詞」時讀，同一詞的 L2/L3 不重複朗讀
  //   - 瀏覽器在首次使用者手勢前會擋住語音，這裡不強求，try/catch 忽略
  if (current.item.wordId !== lastAutoSpokeWordId) {
    lastAutoSpokeWordId = current.item.wordId;
    try {
      speakWord(current.targetWord, { lang: PCS_CONFIG.ui.lang });
    } catch { /* autoplay 限制：忽略 */ }
  }
}

/** 視窗尺寸改變（轉向、iPad 分屏）時重新計算，否則會溢出或折行 */
let _fitTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(_fitTimer);
  _fitTimer = setTimeout(fitClozeRow, 120);
});
window.addEventListener('orientationchange', () => setTimeout(fitClozeRow, 200));

/**
 * ★★★ 讓整列字母「永遠排在同一行」。
 *
 * 為什麼需要：`--letter-size` 是固定值（桌機 46px）。"police station"
 * 有 13 格，需要 13×46 + 間距 ≈ 743px，但 .stage 可用寬度只有 684px
 * → 之前 flex-wrap:wrap 會把整列折成兩行，答案列被拆散、看起來像沒對齊。
 *
 * 作法：先在自然尺寸下量 scrollWidth，再依可用寬度等比縮小
 * （同時縮 gap，短詞不會被縮到）；下限 26px，低於下限就不再縮，
 * 改由 .cloze-row 的 overflow-x 橫向滑動，仍然不折行。
 */
function fitClozeRow() {
  const row = document.getElementById('clozeRow');
  if (!row || !row.children.length) return;

  const host = row.parentElement;
  const cs = getComputedStyle(host);
  const avail = host.clientWidth
    - parseFloat(cs.paddingLeft || 0)
    - parseFloat(cs.paddingRight || 0);
  if (avail <= 0) return;

  // 1) 先回到 CSS 的預設尺寸，量出「自然寬度」
  row.style.removeProperty('--letter-size');
  row.style.removeProperty('--letter-gap');

  const base = parseFloat(getComputedStyle(row).getPropertyValue('--letter-size')) || 46;
  let size = base;
  let gap = 10;
  const MIN_SIZE = 20;
  const MIN_GAP = 3;

  // 2) 迭代收斂：量一次 → 依比例縮 → 再量 → 再縮。
  //    單次比例縮放會因為 border / 捨入而留下幾 px 溢出，所以用迴圈逼近
  //    （最多 5 輪，每輪只會更小，一定會停）。
  for (let i = 0; i < 5; i++) {
    const need = row.scrollWidth;
    if (need <= avail || size <= MIN_SIZE) break;
    const r = avail / need;
    size = Math.max(MIN_SIZE, Math.floor(size * r) - 1);
    gap = Math.max(MIN_GAP, Math.floor(gap * r));
    row.style.setProperty('--letter-size', size + 'px');
    row.style.setProperty('--letter-gap', gap + 'px');
  }

  // 3) 真的塞不下（超長詞）→ 保留 overflow-x 橫向滑動，仍然不折行
  row.dataset.fitted = '1';
}

// ══════════════════════════════════════════════
// ★★ r73：鍵盤插座（一個永遠聚焦的 input 吃掉所有按鍵）
//
// 為什麼要這樣做：
//   格子本身是 <input>。輸完一格、程式把焦點移到下一格時，iOS Safari 會把
//   這次 focus() 當成「新的聚焦請求」而收鍵盤 —— 學生只打了一個字母，
//   鍵盤就彈下去（老師在 iPad 上遇到的正是這個）。
//
// 現在的分工：
//   · 格子 readonly + inputmode="none" → 它不接收鍵盤，只負責顯示與「被點」
//   · 點格子 = 移動「作用中的格子」（.active 橙框）+ 把焦點給 #kbSink
//   · 所有按鍵都打在 #kbSink 上，由 JS 寫進對應格子
//   · 焦點永遠停在同一顆元素上 → 鍵盤不會掉；
//     直到整個詞的空都填完才 blur（老師要的「填完才消失」）
// ══════════════════════════════════════════════
let kbSlots = [];
let kbActive = 0;
let kbBound = false;

const kbSinkEl = () => document.getElementById('kbSink');

function kbFocus() {
  const s = kbSinkEl();
  if (!s) return;
  try { s.focus({ preventScroll: true }); } catch { s.focus(); }
}

function kbMarkActive(n, opts = {}) {
  if (!kbSlots.length) return;
  kbActive = Math.max(0, Math.min(n, kbSlots.length - 1));
  kbSlots.forEach((el, i) => el.classList.toggle('active', i === kbActive));
  if (opts.reveal !== false) kbReveal(kbActive, opts.smooth !== false);
}

/**
 * ★★ 2026-11-25：把第 n 格滾到「鍵盤彈起後還看得見」的位置。
 *
 * 為什麼不能用 scrollIntoView：
 *   它把元素置中在**版面視窗**（layout viewport）。但 iOS 彈鍵盤時版面視窗
 *   不會變、變矮的只是**可視區**（visual viewport）—— 置中的結果正好落在
 *   鍵盤後面。老師看到的現象就是：點第一個空，畫面完全不動；
 *   等到開始打字，Safari 為了露出聚焦元素才把頁面往上推。
 *
 * 所以改成用 visualViewport 算出「真正看得到的那一塊」，
 * 把格子放在那塊由上往下 30% 的位置 —— 格子露出、題目與圖也還在上方。
 */
function kbReveal(n = kbActive, smooth = true) {
  const el = kbSlots[n];
  if (!el) return;
  const vv = window.visualViewport;
  const scrollY = window.scrollY || window.pageYOffset || 0;
  const rect = el.getBoundingClientRect();
  const elDocTop = rect.top + scrollY;                 // 文件座標

  const viewTop = vv ? vv.pageTop : scrollY;           // 可見區的文件頂端
  const viewH = vv ? vv.height : window.innerHeight;   // 可見區高度（鍵盤已扣掉）
  const wantTop = viewTop + Math.max(12, viewH * 0.3) - rect.height / 2;

  const delta = elDocTop - wantTop;
  if (Math.abs(delta) < 10) return;                    // 已經在理想位置，不要抖一下

  const top = Math.max(0, scrollY + delta);
  try { window.scrollTo({ top, behavior: smooth ? 'smooth' : 'auto' }); }
  catch { window.scrollTo(0, top); }                   // 舊 iOS 不支援 options
}

/**
 * ★★ 2026-11-25：鍵盤彈起時，給頁面「可以往上捲的空間」。
 *
 * 這是 iOS 上真正的關鍵。Safari 彈鍵盤時 **innerHeight 不變、變矮的是
 * visualViewport**；如果文件本身沒有超出版面高度（docHeight == innerHeight），
 * 那 window.scrollTo() 根本無效 —— 只有「聚焦元素的系統自動捲動」會動一下，
 * 這正是老師看到的「打了字才往上翻」。
 *
 * 作法：偵測到鍵盤佔了畫面高度 → 暫時在 body 底部補等高的 padding，
 * 讓文件變高、可捲動；鍵盤收起就還原。捲動量交給 kbReveal 算。
 */
function kbInset() {
  const vv = window.visualViewport;
  if (!vv) return 0;
  return Math.max(0, Math.round(window.innerHeight - vv.height));
}

let kbPadNow = 0;
function syncKbSpace() {
  const inset = kbInset();
  // 小於 100px 當成「沒有鍵盤」（iPad 分屏 / 瀏覽器工具列也會讓高度浮動）
  const want = inset > 100 ? inset + 32 : 0;
  if (want === kbPadNow) return kbPadNow > 0;
  kbPadNow = want;
  document.body.style.paddingBottom = want ? `${want}px` : '';
  return want > 0;
}

/**
 * 鍵盤彈起 / 收起時，可視區高度會變 —— 這一刻才知道「真正看得到」的範圍，
 * 所以在這裡先補可捲動空間、再校一次位置（不帶動畫，避免和系統的捲動打架）。
 */
(function watchViewport() {
  const vv = window.visualViewport;
  if (!vv) return;
  let t = 0;
  vv.addEventListener('resize', () => {
    clearTimeout(t);
    // 先讓 padding 生效（文件變高）→ 下一帧才捲得動
    syncKbSpace();
    t = setTimeout(() => {
      if (document.activeElement === kbSinkEl()) kbReveal(kbActive, false);
    }, 120);
  });
})();

const kbAllFilled = () => kbSlots.length > 0 && kbSlots.every(el => /[a-zA-Z]/.test(el.value));

function kbWrite(n, ch) {
  const el = kbSlots[n];
  if (!el) return;
  el.value = ch.toLowerCase();
  el.classList.add('filled');
  el.classList.remove('just-fixed');
  delete el.dataset.fixed;
}

function kbClear(n) {
  const el = kbSlots[n];
  if (!el) return;
  el.value = '';
  el.classList.remove('filled', 'ok', 'just-fixed');
  delete el.dataset.fixed;
}

/** 鍵盤不是英文時給一句提示（已判分、在看答案時不打擾） */
function kbHintEnglish() {
  if (answeredAll) return;
  const diag = STAGE.querySelector('#diag');
  if (!diag) return;
  diag.className = 'diagnosis idle';
  diag.textContent = t('game.englishOnly');
}

/** 插座整頁只有一個，事件只綁一次（換題時它不會被重建） */
function kbBindOnce() {
  if (kbBound) return;
  const sink = kbSinkEl();
  if (!sink) return;
  kbBound = true;

  sink.addEventListener('input', () => {
    const raw = sink.value;
    sink.value = '';                        // 插座永遠是空的，只做中轉

    // ★ 中文 / emoji / 數字全部濾掉 —— 「限制英文輸入」就落在這一行
    const letters = raw.replace(/[^a-zA-Z]/g, '');
    if (!letters) {
      if (raw.trim()) kbHintEnglish();
      return;
    }

    for (const ch of letters) {
      if (kbActive >= kbSlots.length) break;
      const el = kbSlots[kbActive];
      kbWrite(kbActive, ch);
      syncInline();
      checkReady();
      if (answeredAll) checkCorrection(el);   // 看過答案後自己改對
      if (kbActive < kbSlots.length - 1) kbMarkActive(kbActive + 1);
    }

    // ★ 整個詞填完 → 才收鍵盤（老師要的行為）
    if (kbAllFilled()) sink.blur();
  });

  sink.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace') {
      e.preventDefault();
      if (kbSlots[kbActive]?.value) kbClear(kbActive);
      else if (kbActive > 0) { kbMarkActive(kbActive - 1); kbClear(kbActive); }
      syncInline(); checkReady();
      return;
    }
    if (e.key === 'ArrowLeft')  { e.preventDefault(); kbMarkActive(kbActive - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); kbMarkActive(kbActive + 1); }
  });

  // 中文輸入法 / 貼上：能在鍵入前擋掉就先擋；
  // composition 期間擋不住的部分，上面的 input 過濾仍會兜住，字不會進格子。
  sink.addEventListener('beforeinput', (e) => {
    if (e.inputType?.startsWith('insert') && e.data && !/[a-zA-Z]/.test(e.data)) {
      e.preventDefault();
      kbHintEnglish();
    }
  });
}

function wireQuestion() {
  kbSlots = [...STAGE.querySelectorAll('.slot-input')];
  kbMarkActive(0);
  kbBindOnce();

  kbSlots.forEach((el, n) => {
    // 點格子：只換「作用中的格子」，鍵盤交給插座
    el.addEventListener('pointerdown', (e) => {
      if (e.button != null && e.button > 0) return;
      e.preventDefault();                   // 不要讓瀏覽器把焦點給 readonly 格子
      kbMarkActive(n);
      kbFocus();                            // 同一個手勢內 focus → iPad 才會彈鍵盤
      // ★ 鍵盤彈起要 250–350ms，彈完可視區才變矮 → 那時再校一次位置。
      //   （visualViewport 的 resize 也會觸發，這裡是沒有該 API 的舊機兜底）
      setTimeout(() => { if (document.activeElement === kbSinkEl()) kbReveal(n, false); }, 380);
    });
    // 用鍵盤 Tab 聚焦後按 Enter 也走這裡
    el.addEventListener('click', () => { kbMarkActive(n); kbFocus(); kbReveal(n); });
  });

  // ★★ 小喇叭：點了之後必須把焦點還回輸入框。
  //
  //  症狀（iPad 最嚴重）：點小喇叭發音 → 焦點離開 input → iPad 收起鍵盤
  //  → 學生要再點一次輸入框才能繼續打字，動作變成「聽音 → 點框 → 打字」，
  //  而且每次聽音都要重來一次。
  //
  //  解法：mousedown/touchstart 時 preventDefault()（阻止瀏覽器把焦點移走），
  //  再在 click 之後手動 focus 回「剛才那一格」。
  //  ★ 記住是哪一格：學生可能正在輸入中間某一格，不該跳回第一格。
  const speakBtn = STAGE.querySelector('#speakBtn');
  if (speakBtn) {
    /* ★★ 2026-11-20 修 bug：iPad 上點小喇叭完全沒反應。
       原因：舊版在 touchstart 上 preventDefault()（想保住輸入框焦點），
       但 iOS Safari 一旦在 touchstart 被 preventDefault，就**不再派發 click**
       → 語音永遠不會執行。桌機的 mousedown 不會有這問題，所以只有 iPad 壞。
       現在改成：在 pointerdown（真正的使用者手勢）裡直接發音並 preventDefault
       （pointerdown 的 preventDefault 不會取消 click，只擋掉 mousedown / 焦點轉移）。
       click 仍保留給鍵盤操作，用時間戳去重。 */
    let spokenAt = 0;

    const doSpeak = () => {
      spokenAt = Date.now();
      playTap();
      speakBtn.classList.add('speaking');
      // ★ sentence 可能是 null（例句在句中挖空失敗、畫面只顯示單詞）——
      //   但「唸出來」跟「畫面怎麼排」是兩件事：只要詞庫裡有例句就照樣唸，
      //   唸不到才退回只唸單詞。
      const sent = current?.sentence || current?.wordObj?.sentences?.[0] || '';
      if (sent) {
        speakSentenceAndWord(sent, current.targetWord,
          { rate: PCS_CONFIG.ui.speechRate, lang: PCS_CONFIG.ui.lang });
      } else {
        speakWord(current.targetWord, { lang: PCS_CONFIG.ui.lang });
      }
      setTimeout(() => speakBtn.classList.remove('speaking'), 2400);

      // ★ 唸完（或立刻）把焦點放回插座，鍵盤不會消失。
      //   r73 起「目前在哪一格」記在 kbActive，不再靠 input 的 focus。
      kbFocus();
    };

    speakBtn.addEventListener('pointerdown', (e) => {
      if (e.button != null && e.button > 0) return;      // 只認主鍵 / 單指
      e.preventDefault();                                // 不轉移焦點 → 不收鍵盤
      doSpeak();
    }, { passive: false });

    speakBtn.addEventListener('click', () => {
      if (Date.now() - spokenAt < 700) return;           // pointerdown 已經唸過
      doSpeak();
    });
  }

  STAGE.querySelector('#submitBtn')?.addEventListener('click', submit);
  STAGE.querySelector('#skipBtn')?.addEventListener('click', skip);
}

/**
 * ★ 訂正回饋：答錯後看過答案，學生又自己改對了 → 綠框 + 正確音效。
 *
 * 為什麼需要：
 *   答錯時畫面會把正確字母顯示在下方（這是教學設計）。學生看完可以自己
 *   改寫輸入框 —— 但原本的程式在 `answeredAll = true` 之後就完全不理
 *   輸入變化了，所以「改對」這個動作沒有任何回饋。
 *   對小學生來說，這等於告訴他「改了也沒用」，下次就不會檢查自己寫的字。
 *
 * ★ 刻意「不」做的事（研究考量）：
 *   不加分、不改 probes、不重寫 exposure、不推進關卡。
 *   這一筆的作答紀錄已經寫成「錯」，研究資料必須如實反映第一次作答；
 *   訂正是教學行為，不是測量行為。
 */
function checkCorrection(el) {
  const bi = Number(el.dataset.index);
  const expect = current?.targetWord?.[bi];
  if (!expect) return;
  const got = el.value.trim().toLowerCase();

  // 答案格也標成「已訂正」，讓學生看到上下兩列都對齊了
  const ans = STAGE.querySelector(`#ans-${bi}`);

  if (got === expect) {
    if (el.dataset.fixed === '1') return;      // 已在正確狀態，不要重複播音效
    el.dataset.fixed = '1';
    el.classList.remove('no');
    el.classList.add('ok', 'just-fixed');
    if (ans) ans.classList.remove('miss');

    const diag = STAGE.querySelector('#diag');
    if (diag) {
      diag.className = 'diagnosis ok';
      diag.textContent = t('game.correct');
    }
    setTimeout(() => el.classList.remove('just-fixed'), 700);

    // ★ 不在此處逐字母播音效 —— 只在「整個詞都改對」時給「一次」肯定，
    //   否則每改對一個字母就響一聲，對小學生反而是干擾（使用者明確反饋）。
    const inputs = STAGE.querySelectorAll('.slot-input');
    let allFixed = true;
    inputs.forEach(inp => {
      const i = Number(inp.dataset.index);
      if (inp.value.trim().toLowerCase() !== (current?.targetWord?.[i] ?? '')) allFixed = false;
    });
    if (allFixed) {
      playCorrect();                            // 整詞訂正完成：一次正確音效
      const row = document.getElementById('clozeRow');
      if (row) {
        const r = row.getBoundingClientRect();
        confettiBurst(r.left + r.width / 2, r.top + r.height / 2);
      } else {
        confettiBurst();
      }
    }
  } else {
    // 又改錯（或清空）→ 回到錯的樣子
    if (el.dataset.fixed !== '1') return;
    delete el.dataset.fixed;
    el.classList.remove('ok', 'just-fixed');
    el.classList.add('no');
    if (ans) ans.classList.add('miss');
  }
}

/**
 * 「再試一次」—— 答錯之後給學生一次重做的機會。
 *
 * 做什麼：
 *   清空所有填空、收起下方已揭示的答案列、把按鈕還原成 Check，
 *   讓這一題回到「還沒作答」的狀態，可以重新輸入一次。
 *   已給定的字母（.slot-given）保持原樣 —— 重做的是作答，不是換題目。
 *
 * 研究資料：已經寫入的「第一次答錯」不會被改寫（如實反映第一次作答）。
 *   重做後再送出，會以新的一次 attempt 記錄（attemptNo 累加），
 *   這對「這個字母要試幾次才對」這個指標反而更有價值。
 */
function tryAgain() {
  const diag = STAGE.querySelector('#diag');
  const btn = STAGE.querySelector('#submitBtn');

  // 清空填空 + 移除所有作答狀態樣式
  STAGE.querySelectorAll('.slot-input').forEach(el => {
    el.value = '';
    el.classList.remove('no', 'ok', 'just-fixed', 'filled');
    delete el.dataset.fixed;
    el.disabled = false;
  });

  // 收起下方已揭示的正確字母
  STAGE.querySelectorAll('.slot-answer').forEach(a => {
    a.className = 'slot-answer';
    a.textContent = '';
  });

  // 例句裡標紅的空格也一併還原
  STAGE.querySelectorAll('.sentence-text .slot-inline')
    .forEach(sl => sl.classList.remove('ok', 'no', 'filled'));

  // 提示文字回到「請填入欠缺的字母」
  if (diag) {
    diag.className = 'diagnosis idle';
    const key = diag.dataset.i18n;
    diag.textContent = key ? t(key, { n: diag.dataset.n }) : '';
  }

  // 按鈕復原：Check（未填完時禁用）／Skip 回來／再試一次收起
  if (btn) {
    btn.textContent = t('game.check');
    btn.classList.remove('next');
    btn.onclick = null;
    btn.disabled = true;
  }
  const retryEl = STAGE.querySelector('#retryBtn');
  if (retryEl) { retryEl.hidden = true; retryEl.onclick = null; }
  const skipEl = STAGE.querySelector('#skipBtn');
  if (skipEl) skipEl.hidden = false;

  answeredAll = false;
  saveState();
  checkReady();
  focusFirst();

  // ★ 2026-11-20：重做時再唸一次這個詞 ——
  //   孩子剛聽完、正要重寫，這時候是最該再聽一次的時間點。
  //   （這是直接點「Try again」的手勢，同步呼叫最可靠。）
  try {
    if (current?.targetWord) speakWord(current.targetWord, { lang: PCS_CONFIG.ui.lang });
  } catch { /* 忽略 */ }
}

function syncInline() {
  // 句子裡的空格跟著輸入狀態變色，但永遠不顯示字母。
  // ★ 例句裡同一個詞可能出現多次 → slot 數量會比答案框多。
  //   所以用 data-bi（目標詞的字母序號）配對，而不是靠順序。
  //   這樣 "I say no, NO, No." 三個 no 會一起對應到同一個答案框。
  const slots = STAGE.querySelectorAll('.sentence-text .slot-inline');
  slots.forEach(slot => {
    const bi = slot.dataset.bi;
    const el = STAGE.querySelector(`.slot-input[data-index="${bi}"]`);
    slot.classList.toggle('filled', !!(el && el.value));
    slot.classList.remove('ok', 'no');
  });
}

function checkReady() {
  const all = [...STAGE.querySelectorAll('.slot-input')].every(el => /[a-zA-Z]/.test(el.value));
  const b = STAGE.querySelector('#submitBtn');
  if (b) b.disabled = !all;
}

function focusFirst() {
  if (!STAGE.querySelector('.slot-input')) return;
  // ★ r73：焦點給插座，不再給格子。
  //   注意 —— 換題是在作答後約 900ms 才發生，已經離開使用者手勢，
  //   iOS 不會為此彈出鍵盤；學生點一下任何一格就會彈（而且之後不會再掉）。
  // ★ 2026-11-25：換題時不主動捲動（reveal:false）—— 那時鍵盤還沒彈，
  //   用「可視區 30%」去算會把圖片與句子推到畫面外；
  //   真正需要捲動的時機是「學生點格子、鍵盤彈起後」，交給 kbReveal。
  kbMarkActive(0, { reveal: false });
  requestAnimationFrame(() => kbFocus());
}

// ★ Enter 統一在這裡處理一次。
//   ★ 之前 input 層與 document 層各處理一次，結果答錯時按一次 Enter
//     會「先判分、再馬上跳題」—— 學生根本看不到正確字母。已修正。
let enterGuard = 0;
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const btn = STAGE.querySelector('#submitBtn');
  if (!btn || btn.disabled) return;

  // 同一個按鍵事件可能被兩個 listener 看到，用時間戳去重
  const now = performance.now();
  if (now - enterGuard < 60) return;
  enterGuard = now;

  e.preventDefault();
  btn.click();
});

// ══════════════════════════════════════════════
// Judge
// ══════════════════════════════════════════════
async function submit() {
  if (answeredAll) return;
  // ★ 這一題已作答 → 不再是「未答完的當前題目」（render() 開頭的續玩邏輯）
  //   否則在換下一題前重新載入，會把同一題再出一次。
  state.pendingItem = null;
  saveState();
  const { wordObj, blanks, target, sentence, level, item, targetWord, analysis } = current;
  const diag = STAGE.querySelector('#diag');
  const btn = STAGE.querySelector('#submitBtn');
  btn.disabled = true;

  // ★★ 2026-11-24：逐格找到「它所屬的靶點」。
  //
  //   舊版整關共用 `target.category` —— 一關只有一個 pattern，所以成立。
  //   現在一關可能同時挖 y（y_as_vowel）和 i_e（magic_e），
  //   若還是整關打同一個類別，後台「哪個語音結構最難」的統計就失真了。
  const targets = current.targets ?? [];
  const targetByIndex = new Map();
  for (const t of targets) for (const b of t.blanks ?? []) targetByIndex.set(b, t);

  const probes = [];
  let allCorrect = true;
  let firstWrong = null;

  for (const bi of blanks) {
    const el = STAGE.querySelector(`.slot-input[data-index="${bi}"]`);
    const got = el.value.trim().toLowerCase();
    const expect = targetWord[bi];
    const correct = got === expect;
    const own = targetByIndex.get(bi);

    el.classList.remove('no');
    if (correct) {
      el.classList.add('ok');
    } else {
      allCorrect = false;
      hadError = true;
      if (!firstWrong) firstWrong = { bi, got, expect };
      el.classList.add('no');
    }

    attempts[bi] = (attempts[bi] ?? 0) + 1;
    probes.push({
      i: bi, expect, got, correct,
      ms: Math.round(performance.now() - questionStart),
      attemptNo: attempts[bi],
      phonClass: own?.category ?? target?.category ?? null,
      targetKey: own?.key ?? null,
      errorCode: correct ? null : diagnose(targetWord, blanks, bi, got, own ?? target).code,
    });
  }

  const durationMs = Math.round(performance.now() - questionStart);

  // ★ 錯了 → 不自動跳題，停住等使用者按 Enter 或按 Next。
  //   使用者要自己決定「看多久」，這對小學生很重要 ——
  //   自動跳走等於剝奪了他們消化回饋的時間。
  if (!allCorrect) {
    playWrong();

    // ★ 2026-11-20：答錯後立刻把這個詞再唸一次 ——
    //   孩子要「先聽清楚正確的字長什麼樣」才有能力自己改。
    //   延後 520ms 等 playWrong 的兩個下行音播完（約 470ms），
    //   否則語音和提示音疊在一起，反而聽不清。
    //   ★ 不用立即同步呼叫是因為 iOS 已經在第一次觸控時 primeSpeech()
    //     解鎖過，後續 setTimeout 內的語音同樣能播出來
    //     （新詞自動朗讀本來就是這樣播的）。
    setTimeout(() => {
      try { speakWord(targetWord, { lang: PCS_CONFIG.ui.lang }); } catch { /* 忽略 */ }
    }, 520);

    diag.className = 'diagnosis no';
    diag.textContent = diagnose(targetWord, blanks, firstWrong.bi, firstWrong.got, target).en;

    // ★ 答錯時，整個單詞逐格顯示在正下方，每格與上方框同寬 → 嚴格對齊。
    //   每個位置都填上正確單詞的對應字母（包含已給的、答對的），
    //   所以下方那一行會自然拼出完整單詞，而不是零散補丁。
    //   原本答錯的那幾格加 .miss（淡橘底），一眼看出錯在哪。
    //
    // ★★ 這裡絕對不能用 forEach 的 index（i）去索引 targetWord！
    //    因為空格那一格是 .cell-sep，本身「沒有」.slot-answer，
    //    所以 .slot-answer 的數量比單詞長度少（少掉每一個空格），
    //    用 i 索引會在空格之後整體往前錯開一格：
    //    顯示成 "police " + "statio"，下排的 station 整個往右竄一格。
    //    正解：字母序號寫在 id（ans-<序號>）上，直接從 id 取回真正的序號。
    STAGE.querySelectorAll('.slot-answer').forEach((a) => {
      const li = Number(a.id.slice(4));      // "ans-12" → 12（含空格位置的真實序號）
      a.className = 'slot-answer show';
      a.textContent = Number.isFinite(li) ? (targetWord[li] ?? '') : '';
    });
    for (const bi of blanks) {
      const el = STAGE.querySelector(`.slot-input[data-index="${bi}"]`);
      const ans = STAGE.querySelector(`#ans-${bi}`);
      if (!el || !ans) continue;
      if (el.value.trim().toLowerCase() !== targetWord[bi]) ans.classList.add('miss');
    }

    // ★ 答錯的資料一樣要記錄 —— 否則研究資料會漏掉「哪個字母最容易錯」，
    //   這正是 PCS 的核心指標。回溯佇列也靠這裡。
    //
    //   ★ spec = 這一關的空組快照。重測時原樣重播，不重新組裝。
    for (const p of probes) {
      recordAnswer(state, {
        wordId: wordObj.wordId, level, probeIndex: p.i,
        correct: p.correct, expect: p.expect, got: p.got,
        phonClass: p.phonClass, ms: p.ms, attemptNo: p.attemptNo,
        spec: current.levelObj,
        // ★ 這個空屬於哪個靶點 —— 補考時只重挖答錯的那個結構
        targetKey: p.targetKey ?? null,
        // ★ r73：每個結構只補考一次（Easy / Difficult 相同）。
        //   這一題本身就是補考 → 再錯也不會無限重排，
        //   scheduler 會順手把佇列裡那一項刪掉，這一局才結束得了。
        retryAllowed: item.kind !== 'retry',
      });
    }

    // ★★ 本局記憶：**逐個靶點**判定，不是整關一個結論。
    //
    //   舊版只標 'fail'，答對的靶點完全不動（保持「未測」）——
    //   於是同一個詞重測時，上一輪明明寫對的 oo 又被挖了一次。
    //   老師看到的就是：「oo 之前寫對了呀，為什麼還會再考一次」。
    //
    //   現在：這個靶點的每一格都對 → 'pass'（下次不挖）；
    //         有任何一格錯 → 'fail'（下次優先挖）。
    //   注意判定必須用「這個靶點自己的格子」，不能用整關的 allCorrect。
    const wrongSet = new Set(probes.filter(p => !p.correct).map(p => p.i));
    for (const tg of targets) {
      const ownBlanks = tg.blanks ?? [];
      if (!ownBlanks.length) continue;
      const failed = ownBlanks.some(b => wrongSet.has(b));
      setTargetMastery(state, wordObj.wordId, [tg.key], failed ? 'fail' : 'pass');
    }

    // ★★ 2026-11-20：答錯的那一輪「不發分」。
    //
    //  原本每一輪都照 `scoreRound` 發分（答對字母 ×10 + 堅持分），
    //  於是同一個詞重試三次＝同一批字母領三次分。
    //  症狀就是老師看到的：正確率 43% 的學生，因為一直重試，分數反而是全班最高。
    //
    //  現在：分數只在「整詞做對」那一刻結算；
    //  堅持分（+5/字母，最多 +10）仍然照文件寫的意旨在成功那一輪發。
    //  答錯的資料照樣完整記錄（研究資料不受影響），只是不計分。
    const scWrong = scoreRound({ probes, durationMs, wordCompleted: false, hadError: true });
    scWrong.points = 0;
    updateChrome();

    enqueue(recordExposure({
      student, word: targetWord, wordId: wordObj.wordId, sentence,
      phrase: wordObj.word, isPhrase: !!current.analysis?.isPhrase,
      level, targetPattern: target?.pattern, targetCategory: target?.category,
      targetWeight: target?.weight, blanks, probes, durationMs,
      targets,
      exposureIndex: current.exposureIndex,
      isRetry: item.kind === 'retry',
      mode: ADVANCED ? 'dictation' : 'progressive',
      difficulty: state.difficulty,
      points: scWrong.points,
    }));

    // 句子裡對應的空格也標紅，讓學生知道錯在句中哪裡
    STAGE.querySelectorAll('.sentence-text .slot-inline').forEach(sl => sl.classList.add('no'));

    // 按鈕變成 Next
    btn.textContent = t('game.next');
    btn.disabled = false;
    btn.classList.add('next');
    btn.onclick = () => { btn.onclick = null; render(); };

    // ★ 已經答錯了 → 把 Skip 換成「再試一次」，給學生一次重做的機會。
    //   答完之後 Skip 已經沒有意義（答案都顯示了），換成重做更實用。
    const skipEl = STAGE.querySelector('#skipBtn');
    if (skipEl) skipEl.hidden = true;
    const retryEl = STAGE.querySelector('#retryBtn');
    if (retryEl) { retryEl.hidden = false; retryEl.onclick = tryAgain; }

    answeredAll = true;      // 已判分，但等使用者確認才換題
    saveState();
    return;
  }

  // ── 全對 ──
  playCorrect();
  diag.className = 'diagnosis ok';
  diag.textContent = t('game.correct');
  // ★ 拼對一個詞 → 在單詞框附近噴一小簇彩帶，小學課堂很有成就感
  const row = document.getElementById('clozeRow');
  if (row) {
    const r = row.getBoundingClientRect();
    confettiBurst(r.left + r.width / 2, r.top + r.height / 2);
  } else {
    confettiBurst();
  }
  STAGE.querySelectorAll('.slot-answer').forEach(a => a.textContent = '');

  for (const p of probes) {
    recordAnswer(state, {
      wordId: wordObj.wordId, level, probeIndex: p.i,
      correct: p.correct, expect: p.expect, got: p.got,
      phonClass: p.phonClass, ms: p.ms, attemptNo: p.attemptNo,
      spec: current.levelObj, targetKey: p.targetKey ?? null,
      // ★ 答對不需要排隊，這個旗標只在答錯時才有意義；
      //   留著是為了讓 recordAnswer 的參數形狀一致。
      retryAllowed: item.kind !== 'retry',
    });
  }

  // ★★ 本局記憶：整關全對 → 這一關的靶點全部標成 'pass'。
  //   下一關組裝時它們的權重 ×0.12，實際效果就是「答對的字母不再挖」。
  setTargetMastery(state, wordObj.wordId, targets.map(tg => tg.key), 'pass');

  // ── 計分 ──
  const sc = scoreRound({
    probes, durationMs,
    wordCompleted: allCorrect,
    hadError,
  });
  const myScore = addScore(student.sessionId, sc);
  updateChrome();

  enqueue(recordExposure({
    student, word: targetWord, wordId: wordObj.wordId, sentence,
    phrase: wordObj.word, isPhrase: !!current.analysis?.isPhrase,
    level, targetPattern: target?.pattern, targetCategory: target?.category,
    targetWeight: target?.weight, blanks, probes, durationMs,
    targets,
    exposureIndex: current.exposureIndex,
    isRetry: item.kind === 'retry',
    mode: ADVANCED ? 'dictation' : 'progressive',
    difficulty: state.difficulty,
    points: sc.points,
  }));

  answeredAll = true;
  saveState();

  // ★ Progressive 的核心：答對一關 → 推進到下一關，不是整個詞跳過。
  //   答錯不推進（會留在同一關重來）。
  //
  // ★★★ 這裡曾經漏掉 `item.kind === 'retry'`：
  //   L1 答錯 → 進重測佇列 → 重測時答對了，但因為 kind 是 'retry'
  //   而被整段條件擋掉 → levelProgress 永遠是 0 → 這個詞永遠不會拿到 L2。
  //   （症狀：Results 裡某個詞只有 L1 資料，永遠停在 0%。）
  //   正確做法：**只要這一關全對就推進**，不管它是首次、輪回還是重測。
  if (ADVANCED) {
    // ★ADV 考試模式：每個詞只做一次 → 不論答對答錯，這個詞都結束了。
    //   記進 masteredWords 只是為了讓結算頁的「You finished N words」
    //   與進度條有正確數字（答錯也算「做過了」，分數會如實反映在準確率）。
    //   ★ 不能用 analysis.levels.length 判斷：那是 progressive 的關卡數，
    //     advanced 只有一關，拿它比會永遠進不了 markMastered。
    markMastered(state, wordObj.wordId);
    saveState();
  } else if (allCorrect) {
    const doneNow = state.levelProgress.get(wordObj.wordId) || 0;
    const reached = Math.max(doneNow, level);
    state.levelProgress.set(wordObj.wordId, reached);

    if (isEasy() && item.kind === 'retry') {
      // ★ Easy：每個詞只有兩次機會 —— 第一次錯了、補考答對，
      //   這個詞就算完成（不再排 L2，否則會出現第三次）。
      markMastered(state, wordObj.wordId);
    } else if (reached >= (current.lvTotal ?? analysis.levels.length)) {
      // 所有關卡都過了 → 這個詞才真的結束
      markMastered(state, wordObj.wordId);
    } else {
      // 還有 L2/L3… → 排進輪回佇列，等新詞發完一輪再回來
      queueNextLevel(state, wordObj.wordId);
    }
    saveState();
  } else {
    // ★ 答錯時把這個詞的「最高完成關卡」記下來，不能讓 levelProgress
    //   停在比實際低的值，否則重測答對時會重複做同一關。
    state.levelProgress.set(
      wordObj.wordId,
      Math.max(state.levelProgress.get(wordObj.wordId) || 0, level - 1),
    );
    saveState();
  }

  await sleep(900);
  render();
}

function skip() {
  if (answeredAll) return;
  answeredAll = true;
  // ★ 同 submit：這一題算答過了，不要讓重新載入再接回同一題
  state.pendingItem = null;
  saveState();

  const { wordObj, level, item, blanks, targetWord } = current;
  // ★ 逐格對到自己所屬的靶點（一關可能有多個 pattern）
  const skipTargets = current.targets ?? [];
  const skipByIndex = new Map();
  for (const tg of skipTargets) for (const b of tg.blanks ?? []) skipByIndex.set(b, tg);

  const probes = blanks.map(bi => ({
    i: bi, expect: targetWord[bi], got: '', correct: false,
    ms: Math.round(performance.now() - questionStart),
    attemptNo: attempts[bi] ?? 1,
    phonClass: skipByIndex.get(bi)?.category ?? current.target?.category,
    targetKey: skipByIndex.get(bi)?.key ?? null,
    errorCode: 'skipped',
  }));

  for (const p of probes) {
    recordAnswer(state, {
      wordId: wordObj.wordId, level, probeIndex: p.i, correct: false,
      expect: p.expect, got: '', phonClass: p.phonClass, ms: p.ms, attemptNo: p.attemptNo,
      spec: current.levelObj, targetKey: p.targetKey,
      // ★ r73：跳過也算「第一次不會」，只排一次補考
      retryAllowed: item.kind !== 'retry',
    });
  }

  enqueue(recordExposure({
    student, word: targetWord, wordId: wordObj.wordId, sentence: current.sentence ?? '',
    phrase: wordObj.word, isPhrase: !!current.analysis?.isPhrase,
    level, targetPattern: current.target?.pattern, targetCategory: current.target?.category,
    targetWeight: current.target?.weight, blanks, probes,
    targets: skipTargets,
    durationMs: Math.round(performance.now() - questionStart),
    exposureIndex: current.exposureIndex, isRetry: item.kind === 'retry',
    mode: ADVANCED ? 'dictation' : 'progressive',
    difficulty: state.difficulty, skipped: true,
  }));

  state.poolIndex = Math.max(state.poolIndex, state.order.indexOf(wordObj.wordId) + 1);
  saveState();
  render();
}

// ══════════════════════════════════════════════
// Chrome
// ══════════════════════════════════════════════
// ★ r73：進度條的兩個記憶變量
//   progressRunSeed —— 這一局的種子。換局（Play again / 轉 difficulty）→ 歸零重走。
//   progressShown   —— 目前畫在條上的百分比。只增不減：
//                      有時候同一個詞會被重畫兩次（render + 作答），
//                      寬度來回跳一下看起來就像「清空又重來」。
let progressRunSeed = null;
let progressShown = 0;

/** 這一局走到幾 %（以「關卡」為單位，見 runPlan） */
function progressPct() {
  if (!state || !bank.length) return 0;
  const plan = runPlan();
  if (!plan.total) return 0;
  let done = 0;
  for (const [wordId, n] of plan.perWord) {
    if (state.masteredWords?.has?.(wordId)) { done += n; continue; }
    done += Math.min(state.levelProgress?.get?.(wordId) ?? 0, n);
  }
  return progress(state, { done, total: plan.total });
}

function updateChrome() {
  const my = loadMyScore(student.sessionId);
  document.getElementById('pointsNum').textContent = my.points;

  const seed = state?.rngSeed ?? '';
  if (seed !== progressRunSeed) { progressRunSeed = seed; progressShown = 0; }
  progressShown = Math.max(progressShown, progressPct());
  document.getElementById('progressFill').style.width = progressShown + '%';

  if (state) {
    // ★ 2026-11-25：這裡原本是 poolIndex + 1，跟題目上方的 Word X of Y
    //   （用 poolIndex）差一號 —— 同一頁會同時出現「Word 7 of 9」與「Word 6 of 9」。
    //   poolIndex 在 nextItem() 裡已經先 ++（代表這個詞已發出），所以不加。
    document.getElementById('progressLabel').textContent =
      t('game.progress', { n: Math.min(state.poolIndex, state.order.length), total: state.order.length });
    document.getElementById('reviewLabel').textContent =
      state.retryQueue.length ? `${state.retryQueue.length} ${t('game.pendingReview', { n: '' }).trim()}` : '';
  }
  // ★ 自己的分數變了 → 常駐排行要立刻跟上（用快取重畫，不發網路請求）
  repaintRanking();
  // ★ r76：順便把「目前為止」的分數送上去，讓同學的排行榜也即時跳動
  queueLiveRank();
}

// Result
// ══════════════════════════════════════════════
async function renderResult() {
  const s = summarise(state);
  const my = loadMyScore(student.sessionId);
  playComplete();

  // ★ r73：整局結束 → 進度條一定走到頭。
  //   有兩種情況會讓「關卡完成數」差一點點：
  //     · Easy 補考又錯 → 那個詞不再排隊，這一局就帶著它結束；
  //     · 學生按 Skip → 那一關不算完成，但這一局已經結束了。
  //   結算頁上還留著半條進度，看起來像「我沒做完」，所以這裡直接補滿。
  progressShown = 100;
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('reviewLabel').textContent = '';

  // ★ Recap：把這一局練過的詞列出來，打勾的 = 完全掌握、◐ = 還沒全部過關。
  //   小學課堂結束時回顧一下很有用，也讓老師一眼看到誰還卡在哪。
  const recapItems = bank.map(w => {
    const done = state.masteredWords.has(w.wordId);
    const emoji = w.imageEmoji || emojiForWord(w.word, w.category);
    return `<li class="recap-item ${done ? 'done' : 'partial'}">
        <span class="recap-emoji">${emoji}</span>
        <span class="recap-word">${escapeHtml(w.word)}</span>
        <span class="recap-mark">${done ? '✓' : '◐'}</span>
      </li>`;
  }).join('');

  STAGE.innerHTML = `
    <div class="result-card">
      <div class="result-emoji">🎉</div>
      <h2>${escapeHtml(t('done.title'))}</h2>
      <p class="sub">${escapeHtml(t('done.sub', { n: s.wordsMastered }))}
        <span class="diff-chip ${isEasy() ? 'easy' : 'hard'}">${escapeHtml(t(isEasy() ? 'diff.easyTag' : 'diff.hardTag'))}</span>
      </p>

      <div class="result-points">⭐ ${my.points}</div>

      <div class="result-stats">
        <div class="stat-box"><div class="v">${(s.accuracy * 100).toFixed(0)}%</div><div class="k">${escapeHtml(t('done.accuracy'))}</div></div>
        <div class="stat-box"><div class="v">${(s.avgProbeMs / 1000).toFixed(1)}s</div><div class="k">${escapeHtml(t('done.avgTime'))}</div></div>
        <div class="stat-box"><div class="v">${s.wordsMastered}</div><div class="k">${escapeHtml(t('done.words'))}</div></div>
        <div class="stat-box"><div class="v">${s.correct}/${s.probes}</div><div class="k">${escapeHtml(t('done.correct'))}</div></div>
      </div>

      <div class="recap">
        <h3 class="recap-title">${escapeHtml(t('done.recap'))}</h3>
        <ul class="recap-list">${recapItems}</ul>
      </div>

      <div class="result-actions">
        ${isEasy() ? `<button class="btn-continue" id="hardBtn" type="button" data-i18n="done.continueHard">Continue with Difficult</button>` : ''}
        <button class="btn-again" id="againBtn" type="button">
          <span data-i18n="done.playAgain">Play again</span>
          <i class="ico-again" aria-hidden="true">↻</i>
        </button>
        <button class="btn-done" id="doneBtn" type="button" data-i18n="done.back">Back</button>
      </div>
    </div>
  `;
  applyI18n(STAGE);
  // ★ 整局結束 → 大範圍撒彩帶慶祝
  confettiCelebrate();

  // ★ 重玩時把「這一局錯過的結構 / 沒考到的詞」帶到下一局。
  //   一定要在 startNewRun 之前算 —— 它會把 state 換掉。
  const carry = buildCarry(state);

  STAGE.querySelector('#doneBtn')?.addEventListener('click', () => { location.href = 'index.html'; });
  STAGE.querySelector('#againBtn')?.addEventListener('click', () => startNewRun(DIFF, carry));
  STAGE.querySelector('#hardBtn')?.addEventListener('click', () => startNewRun('difficult', carry));

  localStorage.removeItem(`pcs.state.${student.sessionId}`);
  await pushRankSession();
}

/**
 * 把 session 寫進 Firestore，讓排名可以讀。
 *
 * ★ 2026-10-16（Bug 2）：寫**兩份**。
 *   ① sessions/{sessionId} —— 完整摘要，rules 只給老師讀（研究資料）。
 *   ② rankBoard/{sessionId} —— 只含「排行榜 UI 本來就看得見的欄位」，
 *      rules 允許已登入者讀。
 *   為什麼要分兩份：原本只寫 sessions，而它的 read 規則是 teacherOrList()，
 *   學生（匿名登入）根本讀不到 → 即時排名永遠拉不到資料，
 *   畫面恆顯示 "Waiting for other pupils…"。光修 className 不夠，
 *   必須讓學生有可讀的來源；但完整研究資料不能因此外流，所以另開一個
 *   只帶公開欄位的集合。
 */
async function pushRankSession() {
  let ctx = null;
  try {
    const { initFirestore, currentAuthUid } = await import('./assets/js/firebase.js');
    const { mod, db } = await initFirestore();
    const { doc, writeBatch } = mod;
    const my = loadMyScore(student.sessionId);
    const payload = buildRankSession({
      student, score: my,
      startedAt: state.startedAt ?? Date.now(),
      endedAt: Date.now(),
      state,
    });
    // ★ authUid：rules 的 isStudentWrite() 一定要比對這個欄位，
    //   缺了就整份拒絕 —— 症狀是排名永遠是空的。
    const authUid = currentAuthUid();
    if (!authUid) { console.warn('[PCS] 尚未登入，略過 session 上傳'); return; }
    const serverTs = Date.now();

    ctx = { db, doc, writeBatch, payload, authUid, serverTs };
    await commitRankBatch(ctx);
  } catch (e) {
    // ★ r76：學生端已改成「只放記憶體」的快取（見 firebase.js），
    //   所以離線或連線抖一下時這次寫入不會自己排隊等重連 —— 這裡補一次重試，
    //   免得學生剛好在那一刻斷線就丟了最終成績。
    console.warn('[PCS] session 上傳失敗，2.5 秒後重試一次', e?.message);
    await new Promise(r => setTimeout(r, 2500));
    try {
      if (ctx) await commitRankBatch(ctx);
    } catch (e2) {
      console.warn('[PCS] session 重試仍失敗（分數已在本機）', e2?.message);
    }
  }
}

/** 建一個新的 batch 並送出（重試時要重新建，失敗的 batch 不能重用） */
async function commitRankBatch({ db, doc, writeBatch, payload, authUid, serverTs }) {
  const batch = writeBatch(db);
  // ① 完整 session（老師專屬）
  batch.set(doc(db, PCS_CONFIG.collections.sessions, `${student.sessionId}_r${runNo()}`), {
    ...payload, authUid, serverTs,
  });
  // ② 公開排名板（學生可讀）—— 只帶排行榜上看得見的欄位
  //   ★ doc id 帶局號：同一天重玩不會覆蓋上一局的成績，
  //     排行榜取「最高分那一局」→ points 與 accuracy 一定同一局。
  //   ★★ r76：結算這一份多一個 `_f` 後綴（final）。
  //     因為作答途中會先寫一份同名（不帶 _f）的即時分數；若結算時寫回同一份，
  //     在「只准 create、不准 update」的舊安全規則下會被拒絕 → 成績整個丟掉。
  //     分成兩個 doc 之後，結算永遠是一次 create，新舊規則都寫得進去；
  //     排行榜讀取時會依「同一位學生取最高分」合併，所以只會顯示最終那份。
  batch.set(doc(db, PCS_CONFIG.collections.rankBoard, `${student.sessionId}_r${runNo()}_f`), {
    sessionId: payload.sessionId,
    assignmentId: payload.assignmentId,
    pin: payload.pin,
    className: payload.className,
    classNo: payload.classNo,
    studentName: payload.studentName,
    dateKey: payload.dateKey,          // ★ 排行榜只比今天
    // ★ r68：排行榜分上下兩欄（簡單 / 困難），靠這個欄位分組。
    //   同一個學生兩個難度都玩過 → 兩篇 doc、兩欄都出現。
    difficulty: payload.difficulty,
    points: payload.points,
    accuracy: payload.accuracy,
    wordsMastered: payload.wordsMastered,
    endedAt: payload.endedAt,
    authUid, serverTs,
  });
  await batch.commit();
}

// ══════════════════════════════════════════════
// 即時分數（r76）
// ══════════════════════════════════════════════
/**
 * ★★ 2026-11-25（r76）：作答途中就把分數寫上排行榜。
 *
 * 為什麼：原本 rankBoard 只在**整局結束**才寫一次。所以一場 20 分鐘的課，
 *   前 19 分鐘學生看到的排行榜永遠是空的 —— 老師的原話是
 *   「依舊看不到實時的 Class Ranking，我看不到自己的分數」。
 *
 * 作法：每答完一題就叫一次（節流 4 秒），寫一份「局號」doc；
 *   結算時另外寫一份 `…_r<n>_f`（見 pushRankSession 的說明）。
 *   排行榜讀取時會依學生合併、取最高分那一筆 → 同一頁只會看到他最新的成績。
 *
 * ⚠ Firestore rules：這一招需要「本人可以更新自己那一列」的規則
 *   （firestore.rules 的 rankBoard.update，r76 已放寬）。
 *   若學校的 Firestore 還是舊規則，第一次寫入之後的更新會被拒絕 →
 *   這裡會收到 permission-denied，直接關掉即時上報（每個分頁只會嘗試一次）；
 *   結算時寫的是另一份 `_f` 文件、屬於 create，照樣寫得進去，
 *   功能只是退回「結束才有分數」，不會壞。
 */
let liveRankTimer = 0;
let liveRankLast = 0;
let liveRankOff = false;

function queueLiveRank() {
  if (liveRankOff || !state) return;
  if (liveRankTimer) return;
  const wait = Math.max(0, 4000 - (Date.now() - liveRankLast));
  liveRankTimer = setTimeout(() => { liveRankTimer = 0; pushLiveRank(); }, wait);
}

async function pushLiveRank() {
  if (liveRankOff || !state) return;
  // 一題都還沒答 → 不要寫（避免在榜上留下一筆 0 分的紀錄）
  if (!state.stats || !state.stats.probes) return;
  liveRankLast = Date.now();
  try {
    const { initFirestore, currentAuthUid } = await import('./assets/js/firebase.js');
    const { mod, db } = await initFirestore();
    const { doc, setDoc } = mod;
    const authUid = currentAuthUid();
    if (!authUid) return;
    const my = loadMyScore(student.sessionId);
    const s = state.stats;
    const accuracy = s.probes ? +(s.correct / s.probes).toFixed(4) : 0;
    await setDoc(doc(db, PCS_CONFIG.collections.rankBoard, `${student.sessionId}_r${runNo()}`), {
      sessionId: student.sessionId,
      assignmentId: student.assignmentId ?? null,
      pin: student.pin ?? null,
      className: student.className ?? '',
      classNo: student.classNo,
      studentName: student.studentName,
      dateKey: todayKey(),
      difficulty: state.difficulty === 'easy' ? 'easy' : 'difficult',
      points: my.points,
      accuracy,
      wordsMastered: state.masteredWords?.size ?? 0,
      endedAt: Date.now(),
      authUid,
      serverTs: Date.now(),
      syncState: 'pending',
    }, { merge: true });
  } catch (e) {
    const m = e?.message || '';
    if (/permission|insufficient|denied/i.test(m)) {
      liveRankOff = true;
      console.info('[PCS] 即時分數上報被 rules 拒絕（結算時仍會上傳）', m);
    }
  }
}

// 離開頁面（切到別的分頁、按返回、關掉）前，盡量把目前分數寫上去 ——
// 讓「玩到一半就跑掉」的學生也留在榜上。
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') pushLiveRank();
});
window.addEventListener('pagehide', () => { pushLiveRank(); });

// Leaderboard
// ══════════════════════════════════════════════
const drawer = document.getElementById('rankDrawer');
const drawerBg = document.getElementById('drawerBg');

document.getElementById('rankToggle').addEventListener('click', () => openDrawer());
document.getElementById('rankClose').addEventListener('click', () => closeDrawer());
drawerBg.addEventListener('click', () => closeDrawer());
// 刷新鈕：onSnapshot 之外的立即手動拉取（備用，網路抖動時可用）
document.getElementById('rankRefresh').addEventListener('click', () => refreshRankingOnce());

// ══ 實時訂閱狀態 ══
let rankUnsub = null;      // onSnapshot 取消訂閱函式
let rankStarting = false;  // 防止開啟期間重複訂閱
let lastRanking = null;    // 最近一次的名單（重畫用，不發請求）

/** 用快取名單重畫（分數一變就呼叫，讓常駐排行即時反映自己） */
function repaintRanking() {
  if (!lastRanking || drawer.hidden) return;
  drawRanking(lastRanking.map(s => ({ ...s })));
}

/**
 * ★ 2026-11-20：常駐模式。
 *   比賽時排行榜要「一直看得到、在旁邊、即時更新」——
 *   原本只有點 🏆 才打開，而且一打開就壓一層全螢幕遮罩，
 *   等於每次想看排名都得先擋住題目。
 *   作法：同一個 DOM 換姿態（body.rank-pinned）：
 *     · 不加遮罩（drawerBg 永遠隱藏）
 *     · 固定在右側窄欄（寬螢幕）或底部橫條（窄螢幕），由 CSS 決定
 *     · 進課程時自動開、自動訂閱 → 任何同學交成績都會即時刷新
 */
function openDrawer() {
  document.body.classList.add('rank-pinned');
  drawer.hidden = false;
  drawerBg.hidden = true;          // 常駐模式不需要遮罩（會擋住答題）
  startRanking();
}

function closeDrawer() {
  document.body.classList.remove('rank-pinned');
  drawer.hidden = true;
  drawerBg.hidden = true;
  stopRanking();
}

/** 進課程後自動把排行榜釘在旁邊 */
function pinRanking() {
  if (NO_SESSION) return;
  openDrawer();
}

// 開啟抽屜時訂閱：任何同學提交新成績，畫面會即時刷新
//
// ★★ 2026-11-25：加上自動重試。
//   原本 onSnapshot 一失敗就永遠停在那裡 —— 學生看到的是「Waiting for other
//   pupils…」永遠不動（他明明有分數），而且不會自己好。
//   實際原因通常是「這個分頁還沒有匿名身分」：開頁瞬間網路沒好、或從上一頁
//   返回時 token 掉了 → rules 直接拒絕 → 監聽死掉。
//   現在失敗會重訂閱 3 次（間隔 1.5s / 3s / 4.5s），並把提示寫在面板裡。
let rankRetryCount = 0;
let rankRetryTimer = 0;
let rankFirstTimer = 0;    // 等「第一個快照」的計時器（見 startRanking 尾端）
let rankGotSnap = false;   // 這次訂閱有沒有收到過任何快照

async function startRanking() {
  if (rankUnsub || rankStarting) return;   // 已在訂閱中
  rankStarting = true;
  rankGotSnap = false;
  const body = document.getElementById('rankBody');
  const errEl = document.getElementById('rankErr');

  // ★ 2026-10-16：沒有分組依據時說清楚，別讓學生以為是網路壞了。
  //   正常流程 assignmentId 一定存在；會走到這裡代表是異常/舊資料。
  if (!student.assignmentId && !student.className) {
    body.innerHTML = `<div class="rank-loading">${escapeHtml(t('rank.noGroup'))}</div>`;
    if (errEl) errEl.hidden = true;
    rankStarting = false;
    return;
  }

  // ★★ 2026-11-25（r76）：先把自己畫上去，不等網路。
  //
  //   原本這裡先寫 "Waiting for other pupils…"，然後等 Firestore 第一個快照
  //   才第一次 drawRanking()。只要那個快照沒來（身分還沒好、iPad 待機醒來、
  //   連線卡住），面板就永遠那句「Waiting…」——
  //   學生／老師看到的就是「排行榜全沒了、我連自己的分數都沒有」。
  //   現在本機資料先畫：自己一定在榜上，別人的分數到了再疊上去。
  if (lastRanking) drawRanking(lastRanking.map(s => ({ ...s })));
  else drawRanking([]);
  if (errEl) errEl.hidden = true;

  const unsub = await subscribeClassRanking(student, (ranking) => {
    rankGotSnap = true;
    clearTimeout(rankFirstTimer);
    rankRetryCount = 0;
    if (errEl) errEl.hidden = true;
    drawRanking(ranking);
    applyI18n(document.getElementById('rankDrawer'));
  }, (err) => {
    console.warn('[PCS] 排名即時訂閱失敗（不影響作答）', err?.message);
    if (errEl) {
      errEl.hidden = false;
      errEl.textContent = '⚠ ' + t('rank.readFail');
    }
    // 自動重試（最多 3 次）—— 多半是身分還沒建立好，重訂閱時會再跑一次匿名登入
    if (rankRetryCount < 3 && !drawer.hidden) {
      rankRetryCount += 1;
      clearTimeout(rankRetryTimer);
      rankRetryTimer = setTimeout(() => {
        stopRanking();
        startRanking();
      }, 1500 * rankRetryCount);
    }
  });
  rankStarting = false;
  // 訂閱初始化期間使用者已關掉抽屜 → 立即取消，避免殘留監聽
  if (drawer.hidden) { try { unsub(); } catch { /* noop */ } return; }
  rankUnsub = unsub;

  // ★ 看門狗：onSnapshot 正常會在 1 秒內送第一個快照。
  //   7 秒還沒來，代表這個監聽已經卡住（Safari 從 bfcache 回來、iPad 待機
  //   喚醒後最常見）—— 它不會報錯，只會**永遠不回來**，所以只能自己重訂閱。
  clearTimeout(rankFirstTimer);
  rankFirstTimer = setTimeout(() => {
    if (rankGotSnap || drawer.hidden) return;
    if (rankRetryCount >= 2) {
      if (errEl) { errEl.hidden = false; errEl.textContent = '⚠ ' + t('rank.readFail'); }
      return;
    }
    rankRetryCount += 1;
    console.warn('[PCS] 排行榜 7 秒內沒有快照 → 重新訂閱');
    stopRanking();
    startRanking();
  }, 7000);
}

// 關閉抽屜時取消訂閱，離開後不再監聽
function stopRanking() {
  clearTimeout(rankRetryTimer);
  clearTimeout(rankFirstTimer);
  if (rankUnsub && typeof rankUnsub === 'function') {
    try { rankUnsub(); } catch { /* noop */ }
  }
  rankUnsub = null;
  rankStarting = false;
}

// ★ 網路回來時重新訂閱一次（iPad 從飛航／待機回來最常見的「榜突然空了」）
window.addEventListener('online', () => {
  if (!drawer.hidden) { stopRanking(); rankRetryCount = 0; startRanking(); }
});

// ★ 從上一頁（bfcache）返回時，Firestore 的監聽通常已經斷了 → 重訂閱一次。
//   不整頁重載：那會把學生正在打的字母吃掉；這裡只修排行，不動作答狀態。
window.addEventListener('pageshow', (e) => {
  if (!e.persisted) return;
  if (!drawer.hidden) { stopRanking(); rankRetryCount = 0; startRanking(); }
});

// 手動刷新（備用）：立即拉一次最新資料，疊加在即時訂閱之上
async function refreshRankingOnce() {
  const ranking = await fetchClassRanking(student);
  drawRanking(ranking);
  applyI18n(document.getElementById('rankDrawer'));
}

/**
 * ★ 2026-11-24（r68）：排行榜分成上下兩欄（簡單 / 困難）。
 *
 * 為什麼一定要分開：Easy 每題只挖一個結構、每個詞只考兩遍，
 * 題量本來就只有 Difficult 的三分之一。混在同一張榜上，
 * 等於用「做得多」而不是「做得好」排名 —— 選簡單的學生永遠贏。
 *
 * 同一個學生兩個難度都玩過 → 兩欄都會出現（Firestore 是兩篇 doc）。
 */
const normDiff = d => (d === 'easy' ? 'easy' : 'difficult');

function drawRanking(ranking) {
  // ★ 留一份最新的名單：自己的分數一變（updateChrome）就用它重畫，
  //   不必再打一次 Firestore。
  lastRanking = ranking.map(s => ({ ...s }));

  const body = document.getElementById('rankBody');
  const my = loadMyScore(student.sessionId);
  // 這一局目前為止的正確率 —— 本機分數一定要配本機正確率，
  // 否則「自己」那一列會出現「300 分 / 0%」這種看起來像壞掉的組合。
  const myAcc = state?.stats?.probes ? state.stats.correct / state.stats.probes : 0;
  // ★ 還沒選難度時 myDiff = null：這時顯示「我在困難組第 1 名」是錯的
  //   （他根本還沒選），所以先不放自己，選完難度就會出現在正確那一欄。
  const myDiff = DIFF ? normDiff(DIFF) : null;

  const isMe = s => String(s.classNo) === String(student.classNo) && s.name === student.studentName;

  // 本機分數只併進「我目前這個難度」那一欄
  const me = myDiff ? ranking.find(s => isMe(s) && normDiff(s.difficulty) === myDiff) : null;
  if (me) {
    if (my.points >= me.points) { me.points = my.points; me.accuracy = myAcc; }
  } else if (myDiff) {
    // ★★ 2026-11-25（r76）：一律把自己放進榜上。
    //
    //   原本的條件是 `my.points > 0` —— 剛開局、或這一局還沒拿到分數時，
    //   榜上就只有 Firestore 回來的那幾筆（通常一筆都沒有），
    //   畫面永遠停在 "Waiting for other pupils…"，學生看不到自己的分數，
    //   老師也會問「他明明在玩，人呢？」。
    //   現在即使 0 分也顯示自己（★ 標記），至少知道「我在榜上、分數會動」。
    ranking.push({
      classNo: student.classNo, name: student.studentName,
      difficulty: myDiff, points: my.points, accuracy: myAcc, rank: 0,
    });
  }

  const groups = [
    { key: 'easy', title: t('rank.easyGroup'), rows: [] },
    { key: 'difficult', title: t('rank.hardGroup'), rows: [] },
  ];
  for (const r of ranking) {
    (normDiff(r.difficulty) === 'easy' ? groups[0] : groups[1]).rows.push(r);
  }
  for (const g of groups) {
    g.rows.sort((a, b) => b.points - a.points || b.accuracy - a.accuracy);
    g.rows.forEach((s, i) => { s.rank = i + 1; });
  }

  // ★ 正常情況下上面一定把自己放進榜了 → 這裡只在「連自己都沒有」時才會走到
  //   （例如還沒 join 完就被開起來）。留著是為了不要畫出一個空白的框。
  if (!ranking.length) {
    body.innerHTML = `<div class="rank-loading">${escapeHtml(t('rank.waiting'))}</div>`;
    return;
  }

  body.innerHTML = groups.map((g) => {
    const top = g.rows.slice(0, 10);
    const list = top.length
      ? `<ol class="rank-list">
          ${top.map((s) => {
            const medal = s.rank === 1 ? '🥇' : s.rank === 2 ? '🥈' : s.rank === 3 ? '🥉' : s.rank;
            return `<li class="${isMe(s) ? 'me' : ''}">
              <span class="rk">${medal}</span>
              <span class="nm">${escapeHtml(s.name)}${isMe(s) ? ' ★' : ''}</span>
              <span class="sc">${s.classNo}</span>
              <span class="acc">${s.accuracy ? Math.round(s.accuracy * 100) + '%' : '—'}</span>
              <span class="pt">${s.points}</span>
            </li>`;
          }).join('')}
        </ol>`
      : `<div class="rank-empty">${escapeHtml(t('rank.groupEmpty'))}</div>`;
    const mine = myRank(g.rows, student.classNo, student.studentName);
    // ★ 「我的名次」只在**目前這一局所屬**的那一欄顯示。
    //   同時玩過兩欄的學生（Easy 做完又去 Difficult）兩欄都有自己，
    //   兩邊各印一次「Rank #2 / 2」會讓人以為重複計算。
    const isCurrent = g.key === myDiff;
    return `<div class="rank-group ${g.key}${isCurrent ? ' current' : ''}">
      <div class="rank-group-head"><span class="rg-dot"></span>${escapeHtml(g.title)}</div>
      ${list}
      ${isCurrent && mine ? `<div class="my-rank">${escapeHtml(t('rank.rank'))} <b>#${mine.rank}</b> / ${mine.total} · ${mine.points} ⭐</div>` : ''}
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════
// Helpers
// ══════════════════════════════════════════════
const sleep = ms => new Promise(r => setTimeout(r, ms));
const escapeHtml = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ★ 原本這裡有一份 emojiFor(cat) 的類別對照表。
//   已搬到 assets/js/emoji.js 的 emojiForWord(word, category) ——
//   因為「只靠類別猜」不足以區分同類別的不同詞（place 一律 🏠），
//   而且同一份邏輯必須讓後台建立課程時共用，才不會兩邊不一致。

// ── test hooks ──
window.__PCS__ = {
  get state() { return state; },
  get current() { return current; },
  answer: (map) => {
    for (const [i, ch] of Object.entries(map)) {
      const el = STAGE.querySelector(`.slot-input[data-index="${i}"]`);
      if (el) { el.value = ch; el.dispatchEvent(new Event('input', { bubbles: true })); }
    }
    STAGE.querySelector('#submitBtn')?.click();
  },
  skip: () => STAGE.querySelector('#skipBtn')?.click(),
  // ★ 截圖/回歸用：直接把這一局推到結束，檢查結算頁與排行榜分欄
  finish: () => {
    state.masteredWords = new Set(state.order);
    state.poolIndex = state.order.length;
    state.retryQueue = [];
    state.levelQueue = [];
    render();
  },
  render,
  t,
};

window.addEventListener('beforeunload', () => stopSpeaking());

// ★ 必須放在檔案最尾端 —— 呼叫時所有 const 都要已初始化，
//   放在中間會讀到 TDZ（暫時性死區）的值而整個 module 失敗。
// ★ NO_SESSION 時不呼叫 init()：上面已經 location.replace 回登入頁，
//   再跑只會把內建詞庫載進來、在跳轉前開一局。
if (!NO_SESSION) {
  init().catch(e => {
    console.error('[PCS] init failed', e);
    const st = document.getElementById('stage');
    if (st) st.innerHTML = `<div class="empty" style="padding:50px 20px">
      <div class="big">⚠️</div>
      <p>Loading failed</p>
      <p style="font-size:12.5px;margin-top:10px;color:var(--ink-soft)">${escapeHtml(e.message)}</p>
    </div>`;
  });
}
</script>
