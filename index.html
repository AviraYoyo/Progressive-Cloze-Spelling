<!-- ★ 快取破壞守衛：靜態站沒有 build step，瀏覽器會長期快取舊 .js。
     改了程式碼但使用者跑舊檔，症狀會被誤判成「修正沒生效」。
     版本不一致就強制重整。改程式碼後請同步更新 config.js 的 BUILD_ID。 -->
<script>
(function () {
  var BUILD = '2026-11-25-r80';
  var KEY = 'pcs.build';
  try {
    var seen = localStorage.getItem(KEY);
    if (seen === BUILD) return;
    localStorage.setItem(KEY, BUILD);
    if (seen && seen !== BUILD) {
      // ★ 2026-10-16 修正：原本是 pathname + search + '?_r=' + ...
      //   → 當網址本來就有 query（例如 ?pin=1234 分享連結）會變成
      //     "?pin=1234?_r=1759..."，兩個問號 → URLSearchParams 取到的 pin
      //     變成 "1234?_r=1759..." → PIN 格式校驗失敗 → 學生進不了課程。
      //   現在用 URL API 正確合併，並保留原本的 query。
      var u = new URL(location.href);
      u.searchParams.set('_r', String(Date.now()));
      location.replace(u.pathname + u.search + u.hash);
    }
  } catch (e) { /* private mode：略過 */ }
})();
</script>

<!-- ★ 載入失敗提示：module 語法錯誤時瀏覽器不會報錯到 UI，
     這裡用一個全域錯誤監聽器把問題顯式呈現出來。 -->
<script>
window.__pcsFatal = function (msg) {
  var d = document.getElementById('pcsFatal');
  if (!d) {
    d = document.createElement('div');
    d.id = 'pcsFatal';
    d.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:9999;padding:14px 16px;' +
      'background:#FEE2E2;border:2px solid #DC2626;border-radius:10px;color:#7F1D1D;' +
      'font:600 13px/1.6 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.2)';
    document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
    if (document.body) document.body.appendChild(d);
  }
  d.textContent = 'PCS could not start: ' + msg;
};
window.addEventListener('error', function (e) {
  if (e.target && e.target.tagName === 'SCRIPT') {
    window.__pcsFatal('a script failed to load (' + (e.target.src || 'inline') + ')');
  }
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e.reason;
  if (r && r.message && /import|module|syntax/i.test(r.message)) {
    window.__pcsFatal(r.message);
  }
});
</script>

<script type="module">
import {
  primeSpeech, speechStatus, speakSentence,
  listVoiceChoices, getVoicePref, setVoicePref, speakWithVoice,
} from './assets/js/speech.js?v=2026-11-25-r80';
import { unlockAudio, playTap } from './assets/js/sfx.js?v=2026-11-25-r80';
import { initLang, t, applyI18n, mountLangToggle } from './assets/js/i18n.js?v=2026-11-25-r80';
import { joinAssignment, pinFromLocation, isValidPinFormat, normalisePin } from './assets/js/assignments.js?v=2026-11-25-r80';

initLang();
applyI18n(document);
mountLangToggle(document.getElementById('langSlot'), {
  onChange: () => {
    applyI18n(document);
    updateTtsLabel();                                  // 「目前使用 …」也要跟著語言
    if (!voxBackdrop.hidden) renderVoiceModal();
  },
});

// ── TTS 自檢 + 選音色 ──
const ttsBtn = document.getElementById('ttsBtn');
const ttsStatus = document.getElementById('ttsStatus');
const voxBackdrop = document.getElementById('voxBackdrop');
const voxGB = document.getElementById('voxGB');
const voxUS = document.getElementById('voxUS');

const SAMPLE = 'My glasses are on the desk. Glasses.';

/** 只用在把語音名字塞進 HTML（語音名字偶爾帶引號） */
function escAttr(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** 更新 Test sound 下方那行小字：顯示目前用哪個音色 */
function updateTtsLabel() {
  const s = speechStatus();
  if (!s.supported) { ttsStatus.textContent = t('login.audioNone'); return; }
  if (!s.voiceName) { ttsStatus.textContent = t('login.audioPick'); return; }
  const accent = String(s.voiceLang || '').toLowerCase() === 'en-gb' ? 'UK' : 'US';
  ttsStatus.textContent = `${t('voice.using')} ${s.voiceName} · ${accent}`;
  ttsBtn.classList.remove('tts-bad');
  ttsBtn.classList.add('tts-ok');
}

function voiceRow(item, lang, slot, selectedName) {
  const on = selectedName === item.name;
  return `<button class="vox-row${on ? ' on' : ''}" type="button"
            data-name="${escAttr(item.name)}" data-lang="${lang}" data-slot="${slot}">
      <span class="vox-mark" aria-hidden="true">${on ? '✓' : '▶'}</span>
      <span class="vox-nm">${escAttr(item.name)}</span>
      <span class="vox-tag">${lang === 'en-GB' ? 'UK' : 'US'}</span>
    </button>`;
}

/** 重畫兩組選項（每次開窗、每次選完都重畫，勾選狀態才準） */
function renderVoiceModal() {
  const pref = getVoicePref();
  const ready = speechStatus().ready;
  const groups = [
    [voxGB, 'en-GB'],
    [voxUS, 'en-US'],
  ];
  for (const [el, lang] of groups) {
    const list = listVoiceChoices(lang, 3);
    const note = list.length && list.length < 3
      ? `<p class="vox-note">${escAttr(t('voice.few', { n: list.length }))}</p>`
      : '';
    el.innerHTML = (list.length
      ? list.map((v, i) => voiceRow(v, lang, i, pref?.name)).join('')
      : `<p class="vox-empty">${escAttr(t(ready ? 'voice.empty' : 'login.audioLoading'))}</p>`) + note;
  }
}

function openVoiceModal() {
  primeSpeech(); unlockAudio();
  renderVoiceModal();
  voxBackdrop.hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeVoiceModal() {
  voxBackdrop.hidden = true;
  document.body.style.overflow = '';
  updateTtsLabel();
}

ttsBtn.addEventListener('click', openVoiceModal);
document.getElementById('voxClose').addEventListener('click', closeVoiceModal);
document.getElementById('voxDone').addEventListener('click', closeVoiceModal);

voxBackdrop.addEventListener('click', (e) => {
  if (e.target === voxBackdrop) { closeVoiceModal(); return; }
  const row = e.target.closest('.vox-row');
  if (!row) return;
  const { name, lang } = row.dataset;
  const slot = Number(row.dataset.slot) || 0;

  primeSpeech(); unlockAudio();
  setVoicePref({ name, lang, slot });     // ★ 存下來：Start 進課後全站都用它
  renderVoiceModal();                     // 勾選狀態立刻更新
  updateTtsLabel();
  // 用「剛選的這個」唸一次（不受偏好影響，這樣才知道自己選到什麼聲音）
  speakWithVoice(name, SAMPLE, { rate: 0.8 });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !voxBackdrop.hidden) closeVoiceModal();
});

['touchstart', 'click', 'keydown'].forEach(ev =>
  window.addEventListener(ev, () => { primeSpeech(); unlockAudio(); }, { once: true, passive: true }));

// 開頁時就把「目前用哪個音色」寫在 Test sound 下面
setTimeout(() => {
  updateTtsLabel();
  const s = speechStatus();
  if (s.supported && !s.ready) ttsStatus.textContent = t('login.audioLoading');
}, 300);

document.addEventListener('pcs:voices-ready', () => {
  updateTtsLabel();
  if (!voxBackdrop.hidden) renderVoiceModal();   // 語音清單晚到 → 重畫選項
});
updateTtsLabel();

// ── 進入課程（Kahoot 式 PIN）──
const form = document.getElementById('loginForm');
const pinEl = document.getElementById('pinInput');
const classNoEl = document.getElementById('classNo');
const nameEl = document.getElementById('studentName');
const errEl = document.getElementById('joinErr');
const btn = document.getElementById('startBtn');

// 網址帶 ?pin=1234 時自動填入
const urlPin = pinFromLocation();
if (urlPin) pinEl.value = urlPin;

/**
 * ★★ 2026-11-25（r76）：按「返回」回來時，把上次成功進入的 PIN / 班號 / 姓名填回去。
 *
 * 原本情況：學生玩到一半按上一頁 → 表單全部空白（Safari 從快取還原頁面時
 * 不會保留輸入值）→ 要重新打一次 PIN，打錯就進不去，老師還得來幫忙。
 * 現在直接沿用 sessionStorage 裡那次成功的登入（同一天內有效）。
 *
 * 為什麼是 12 小時而不是「當天」：跨午夜的課後練習不該突然要重打一次；
 * 而隔天換課程時，多半會拿到新的 PIN 分享連結（那條會覆蓋這裡的值）。
 * 注意：只填空的欄位 —— 網址帶 ?pin=1234 進來時以網址為準。
 */
function fillPin(pin) {
  const v = normalisePin(pin).replace(/\D/g, '').slice(0, 4);
  if (!pinEl.value && v) pinEl.value = v;
}

function restoreLastStudent() {
  let last = null;
  try { last = JSON.parse(sessionStorage.getItem('pcs.student') || 'null'); } catch { return false; }
  const fresh = last?.joinedAt && Date.now() - last.joinedAt < 12 * 60 * 60 * 1000;
  if (!last?.pin || !fresh) return false;
  fillPin(last.pin);
  if (!classNoEl.value) classNoEl.value = String(last.classNo ?? '');
  if (!nameEl.value) nameEl.value = String(last.studentName ?? '');
  return pinEl.value.length === 4 && !!classNoEl.value && !!nameEl.value;
}

// ★ 第二道保險：sessionStorage 有時候會跟著分頁一起消失
//   （iOS 分頁被系統回收後重開、或從書籤／桌面捷徑重新開啟）。
//   這裡只記 PIN —— 全班共用同一組，不會把上一位同學的姓名帶給下一位。
try {
  if (!pinEl.value) {
    const m = JSON.parse(localStorage.getItem('pcs.lastPin') || 'null');
    if (m?.pin && Date.now() - (m.at || 0) < 12 * 60 * 60 * 1000) fillPin(m.pin);
  }
} catch { /* 私密模式：略過 */ }

if (restoreLastStudent()) {
  // 三欄都齊了 → 直接讓 Start 可以按（少一次點擊）
  btn.focus({ preventScroll: true });
}

/**
 * ★ 從上一頁（bfcache）返回時：**換一份全新的文件**，不是 reload。
 *
 * 為什麼：Safari 會把整頁凍結再還原，但頁面裡的 Firebase 連線、SDK 狀態、
 * 已綁定的事件都不會跟著復活 —— 學生按 Start 之後就卡在
 * 「Finding your class…」永遠不動，重試也一樣，只能關掉分頁重開。
 * 之前用 location.reload()，在 iOS 上常常「看起來有跑、其實還是那份凍結的頁」，
 * 所以改成 location.replace() 帶一個新的 _r 參數 → 一定是新的請求、新的文件，
 * 而且不會在歷史記錄裡多留一筆（按返回不會無限迴圈）。
 */
window.addEventListener('pageshow', (e) => {
  if (!e.persisted) return;
  restoreLastStudent();          // 先填（萬一下面的換頁被擋住，至少能直接按 Start）
  btn.disabled = false;
  btn.textContent = t('join.start');
  const u = new URL(location.href);
  u.searchParams.set('_r', String(Date.now()));
  location.replace(u.pathname + u.search + u.hash);
});

const JOIN_ERRORS = {
  badpin:   'join.errBadPin',
  notfound: 'join.errNotFound',
  closed:   'join.errClosed',
  empty:    'join.errEmpty',
  noclass:  'join.errNoClass',
  noname:   'join.errNoName',
  network:  'join.errNetwork',
};

const showErr = (key) => { errEl.textContent = t(key); errEl.hidden = false; };
const hideErr = () => { errEl.hidden = true; };

pinEl.addEventListener('input', () => {
  pinEl.value = normalisePin(pinEl.value).replace(/\D/g, '').slice(0, 4);
  hideErr();
  if (pinEl.value.length === 4) classNoEl.focus();
});
classNoEl.addEventListener('input', () => {
  classNoEl.value = classNoEl.value.replace(/\D/g, '').slice(0, 4);
  hideErr();
});
// ★ 2026-10-16：姓名框原本沒有 input 監聽 → 填了名字，
//   「Please enter your name」不會自動消失，學生會以為按鍵沒反應。
nameEl.addEventListener('input', hideErr);
[nameEl, pinEl, classNoEl].forEach(el =>
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter') form.requestSubmit(); }));

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  primeSpeech(); unlockAudio(); hideErr();

  const pin = normalisePin(pinEl.value);
  const classNo = classNoEl.value.trim();
  const studentName = nameEl.value.trim();

  if (!isValidPinFormat(pin)) { showErr(JOIN_ERRORS.badpin); pinEl.focus(); pinEl.select(); return; }
  if (!classNo)  { showErr(JOIN_ERRORS.noclass); classNoEl.focus(); return; }
  if (!studentName) { showErr(JOIN_ERRORS.noname); nameEl.focus(); return; }

  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = t('join.finding');

  /**
   * ★★ 2026-11-25：加 12 秒上限。
   *
   * 為什麼：`joinAssignment` 內部是 Firestore 的 getDoc，它**沒有 timeout**。
   * 從上一頁返回（Firestore 連線已死）或學校網路半斷時，這個 promise
   * 永遠不會 resolve → 按鈕停在「Finding your class…」、學生以為當機
   * （這就是老師說的「點 Start 會卡死」）。超時就當成網路錯誤，
   * 至少把按鈕還回去，可以再試一次。
   */
  const withTimeout = (p, ms) => Promise.race([
    p,
    new Promise((_, reject) => setTimeout(() => reject(new Error('join-timeout')), ms)),
  ]);

  let r;
  let timedOut = false;
  try {
    r = await withTimeout(joinAssignment({ pin, classNo, studentName }), 10000);
  } catch (err) {
    timedOut = true;
    console.warn('[PCS] join 超時／失敗', err?.message);
    r = { ok: false, error: 'network' };
  }

  /**
   * ★★ 2026-11-25（r76）：卡住就自動「關掉分頁再開」。
   *
   * 為什麼要多這一段：Firestore 的 promise 卡住時（分頁從快取還原、iPad
   * 待機醒來、多分頁搶鎖）**在同一個文件裡再試一百次也還是卡住** ——
   * 老師實測唯一有效的解法就是「把頁面關掉重新打開」。既然如此，就叫程式
   * 自己做：把表單值交出去，換一份全新的文件、換一個乾淨的連線自動再進一次。
   * 學生看到的只是一次很短的白屏，不用自己發現「要關掉再開」。
   *
   * 只自動重試一次（60 秒內不再重試），避免網路真的掛掉時無限重整。
   */
  if (timedOut) {
    let lastTry = 0;
    try { lastTry = Number(sessionStorage.getItem('pcs.join.retry') || 0); } catch { /* 略 */ }
    if (Date.now() - lastTry > 60000) {
      try {
        sessionStorage.setItem('pcs.join.retry', String(Date.now()));
        sessionStorage.setItem('pcs.join.form', JSON.stringify({ pin, classNo, studentName, at: Date.now() }));
      } catch { /* 私密模式：直接走下面的錯誤提示 */ }
      const u = new URL(location.href);
      u.searchParams.set('pin', pin);
      u.searchParams.set('retry', '1');
      u.searchParams.set('_r', String(Date.now()));
      location.replace(u.pathname + u.search + u.hash);
      return;
    }
  }

  if (!r.ok) {
    btn.disabled = false;
    btn.textContent = original;
    showErr(JOIN_ERRORS[r.error] || JOIN_ERRORS.network);
    pinEl.focus(); pinEl.select();
    return;
  }

  // ★ 不存 sessionId —— 學生不需要知道那是什麼。
  //   sessionId 由 PIN + 班號 + 日期在遊戲頁當場生成。
  sessionStorage.setItem('pcs.student', JSON.stringify({
    classNo,
    studentName,
    pin,
    assignmentId: r.assignment.id,
    assignmentTitle: r.assignment.title,
    classTitle: r.assignment.title,        // ★ 後台按課程分組用（與 assignmentTitle 同值，語意更明確）
    phase: r.assignment.phase || 'practice',
    className: r.assignment.className || '',
    // ★ Advanced mode：整詞自行填寫的考試模式（預設 false）
    advanced: !!r.assignment.advanced,
    joinedAt: Date.now(),
  }));
  sessionStorage.setItem('pcs.items', JSON.stringify(r.items));
  // ★ r76：把 PIN 記在 localStorage（只記 PIN，不記姓名）——
  //   下一次同一台裝置開這個首頁時，即使 sessionStorage 已被清掉，
  //   學生也只要打學號和姓名就好。
  try { localStorage.setItem('pcs.lastPin', JSON.stringify({ pin, at: Date.now() })); } catch { /* 略 */ }

  location.href = 'play.html';
});

/**
 * ★ r76：上一次按 Start 卡住時，程式把表單交到這裡來（見上面的超時處理）。
 *   網址帶著 retry=1 → 填好三欄、直接再送一次。
 *   送出後把 retry 參數清掉，之後重新整理不會又自動送。
 */
(function autoRetryJoin() {
  let auto = false;
  try { auto = new URLSearchParams(location.search).get('retry') === '1'; } catch { /* 略 */ }
  if (!auto) return;

  let saved = null;
  try {
    saved = JSON.parse(sessionStorage.getItem('pcs.join.form') || 'null');
    sessionStorage.removeItem('pcs.join.form');
  } catch { /* 略 */ }

  // 參數先清掉（無論資料在不在）
  try {
    const u = new URL(location.href);
    u.searchParams.delete('retry');
    history.replaceState(null, '', u.pathname + u.search + u.hash);
  } catch { /* 略 */ }

  if (!saved || Date.now() - (saved.at || 0) > 120000) return;
  pinEl.value = normalisePin(saved.pin).replace(/\D/g, '').slice(0, 4);
  classNoEl.value = String(saved.classNo || '');
  nameEl.value = String(saved.studentName || '');
  setTimeout(() => form.requestSubmit(), 150);
})();
</script>
